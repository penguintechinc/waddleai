# Trivy secret-scan allowlist for the vllm-ray-xpu image gate (docker-build.yml, build-vllm-ray-images).
# The anthropic SDK (a vLLM dependency) documents its `execution_identity` parameter in docstrings with the
# literal `{"type": "service_account"}`, which trivy's builtin gcp-service-account rule flags as a CRITICAL
# secret. It is a documentation example (an enum discriminator), not a credential: verified against
# anthropic 2.6.0 that these six files contain only that literal, no private_key / client_email.
# Trivy allow-rules are not per-rule-ID, so the allowance is scoped to exactly those six files by path
# (a content regex would also hide a real service-account key). Re-verify when the anthropic pin changes.
allow-rules:
  - id: anthropic-sdk-docstring-service-account-literal
    description: 'anthropic SDK docstring examples, not GCP credentials'
    path: '(^|/)anthropic/(resources/beta/agents/agents|types/beta/(agent_create_params|agent_update_params|beta_managed_agents_agent|beta_managed_agents_session_agent|beta_managed_agents_session_thread_agent))\.py$'
