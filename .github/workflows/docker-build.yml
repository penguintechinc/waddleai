name: Build and Push Multi-Architecture Docker Images

on:
  push:
    branches: [ main, 'v*' ]
    paths:
      - 'proxy/**'
      - 'management/**'
      - 'services/**'
      - 'shared/**'
      - '.version'
      - '.github/workflows/docker-build.yml'
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
    paths:
      - 'proxy/**'
      - 'management/**'
      - 'services/**'
      - 'shared/**'
      - '.version'
      - '.github/workflows/docker-build.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_PROXY: ${{ github.repository }}/proxy
  IMAGE_NAME_MANAGEMENT: ${{ github.repository }}/management

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.13]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Generate epoch64 timestamp
      id: timestamp
      run: |
        EPOCH64=$(date +%s)
        echo "epoch64=$EPOCH64" >> $GITHUB_OUTPUT

    - name: Check version file
      id: version
      run: |
        if [ -f .version ]; then
          VERSION=$(cat .version | tr -d '[:space:]')
          SEMVER=$(echo "$VERSION" | cut -d'.' -f1-3 | sed 's/^v//')
          echo "semver=$SEMVER" >> $GITHUB_OUTPUT

          if git diff --name-only HEAD^ HEAD 2>/dev/null | grep -q "^.version$"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
        else
          echo "semver=0.0.0" >> $GITHUB_OUTPUT
          echo "changed=false" >> $GITHUB_OUTPUT
        fi

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r services/management/requirements.txt
        pip install pytest pytest-asyncio pytest-cov bandit
    
    - name: Run unit tests
      run: |
        python -m pytest tests/unit/ -v --cov=shared --cov-report=xml --cov-report=html
      env:
        PYTHONPATH: ${{ github.workspace }}
    
    - name: Run security check (bandit)
      run: |
        bandit -r proxy management shared -ll -f json -o bandit-results.json || true

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [proxy, management]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Generate epoch64 timestamp
      id: timestamp
      run: |
        EPOCH64=$(date +%s)
        echo "epoch64=$EPOCH64" >> $GITHUB_OUTPUT

    - name: Check version file
      id: version
      run: |
        if [ -f .version ]; then
          VERSION=$(cat .version | tr -d '[:space:]')
          SEMVER=$(echo "$VERSION" | cut -d'.' -f1-3 | sed 's/^v//')
          echo "semver=$SEMVER" >> $GITHUB_OUTPUT

          if git diff --name-only HEAD^ HEAD 2>/dev/null | grep -q "^.version$"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
        else
          echo "semver=0.0.0" >> $GITHUB_OUTPUT
          echo "changed=false" >> $GITHUB_OUTPUT
        fi

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
        tags: |
          # Regular builds (no .version change)
          type=raw,value=beta-${{ steps.timestamp.outputs.epoch64 }},enable=${{ startsWith(github.ref, 'refs/heads/v') && steps.version.outputs.changed != 'true' }}
          type=raw,value=gamma-${{ steps.timestamp.outputs.epoch64 }},enable=${{ github.ref == 'refs/heads/main' && steps.version.outputs.changed != 'true' }}
          type=raw,value=alpha-${{ steps.timestamp.outputs.epoch64 }},enable=${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/v') && steps.version.outputs.changed != 'true' }}

          # Version builds (.version changed)
          type=raw,value=v${{ steps.version.outputs.semver }}-beta,enable=${{ startsWith(github.ref, 'refs/heads/v') && steps.version.outputs.changed == 'true' }}
          type=raw,value=v${{ steps.version.outputs.semver }}-gamma,enable=${{ github.ref == 'refs/heads/main' && steps.version.outputs.changed == 'true' }}

          # Always-present sha tag for security-scan and integration-test
          type=sha,prefix=ci-,format=long,enable=${{ github.event_name != 'pull_request' }}

          # Release tags
          type=semver,pattern={{version}}
          type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./${{ matrix.service }}/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          VCS_REF=${{ github.sha }}

  security-scan:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      matrix:
        service: [proxy, management]

    steps:
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0
      if: github.event_name != 'pull_request'
      with:
        image-ref: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:ci-${{ github.sha }}
        format: 'sarif'
        output: 'trivy-results-${{ matrix.service }}.sarif'
        version: 'v0.69.3'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@ff0a06e83cb2de871e5a09832bc6a81e7276941f  # v3
      if: github.event_name != 'pull_request'
      with:
        sarif_file: 'trivy-results-${{ matrix.service }}.sarif'

  integration-test:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    continue-on-error: true  # Full-stack integration requires postgres/redis; failures are non-blocking

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Create test environment
      run: |
        cat << EOF > docker-compose.test.yml
        services:
          proxy:
            image: ${{ env.REGISTRY }}/${{ github.repository }}/proxy:ci-${{ github.sha }}
            ports:
              - "8000:8000"
            environment:
              - DATABASE_URL=postgresql://test:test@db:5432/waddleai_test
              - LOG_LEVEL=DEBUG
            depends_on:
              db:
                condition: service_healthy

          management:
            image: ${{ env.REGISTRY }}/${{ github.repository }}/management:ci-${{ github.sha }}
            ports:
              - "8001:8001"
            environment:
              - DATABASE_URL=postgresql://test:test@db:5432/waddleai_test
              - REDIS_URL=redis://redis:6379/0
              - JWT_SECRET_KEY=ci-test-secret-key-not-for-production
              - LOG_LEVEL=DEBUG
              - FLASK_ENV=testing
            depends_on:
              db:
                condition: service_healthy
              redis:
                condition: service_healthy

          db:
            image: postgres:15-bookworm@sha256:550245350d614cd36d1a8e90d76c6f6608172659312e53417becbbe722aa4179
            environment:
              POSTGRES_DB: waddleai_test
              POSTGRES_USER: test
              POSTGRES_PASSWORD: test
            healthcheck:
              test: ["CMD-SHELL", "pg_isready -U test -d waddleai_test"]
              interval: 5s
              timeout: 5s
              retries: 10

          redis:
            image: redis:7-bookworm@sha256:24ea35ee039d7345bef2377611e3b1a615231746de4cfea74c1414575ee56167
            healthcheck:
              test: ["CMD", "redis-cli", "ping"]
              interval: 5s
              timeout: 5s
              retries: 10
        EOF

    - name: Start services
      run: |
        docker compose -f docker-compose.test.yml up -d
        sleep 45  # Wait for services to start

    - name: Test management health endpoints
      run: |
        curl -f http://localhost:8001/healthz
        curl -f http://localhost:8001/livez
        curl -f http://localhost:8001/readyz
        curl -f http://localhost:8001/metrics

    - name: Test proxy health endpoint
      run: |
        curl -f http://localhost:8000/healthz || curl -f http://localhost:8000/health

    - name: Test OpenAI-compatible API endpoint
      run: |
        response=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/v1/chat/completions)
        if [ "$response" != "401" ]; then
          echo "Expected 401 response, got $response"
          exit 1
        fi

    - name: Cleanup
      if: always()
      run: |
        docker compose -f docker-compose.test.yml down -v

  release:
    needs: [test, build-and-push, security-scan, integration-test]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Generate changelog
      id: changelog
      run: |
        # Simple changelog generation from git log
        echo "## What's Changed" > CHANGELOG.md
        git log --pretty=format:"* %s (%h)" $(git describe --tags --abbrev=0 HEAD^)..HEAD >> CHANGELOG.md
        echo "" >> CHANGELOG.md
        echo "" >> CHANGELOG.md
        echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$(git describe --tags --abbrev=0 HEAD^)...${GITHUB_REF_NAME}" >> CHANGELOG.md
    
    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        release_name: WaddleAI ${{ github.ref_name }}
        body_path: CHANGELOG.md
        draft: false
        prerelease: false

  cleanup:
    needs: [test, build-and-push, security-scan, integration-test]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      packages: write

    steps:
    - name: Delete untagged images
      uses: actions/github-script@v6
      with:
        script: |
          const response = await github.rest.packages.getAllPackageVersionsForPackageOwnedByOrg({
            package_type: 'container',
            package_name: 'waddleai/proxy',
            org: context.repo.owner,
          });
          
          for (const version of response.data) {
            if (version.metadata.container.tags.length === 0) {
              console.log(`Deleting untagged version: ${version.id}`);
              await github.rest.packages.deletePackageVersionForOrg({
                package_type: 'container',
                package_name: 'waddleai/proxy',
                org: context.repo.owner,
                package_version_id: version.id,
              });
            }
          }