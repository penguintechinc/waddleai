name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, v1.x]
    paths:
      - 'website/**'
      - '.version'
      - '.github/workflows/deploy-cloudflare-pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - '.version'
      - '.github/workflows/deploy-cloudflare-pages.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: '18.17.0'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: |
          cd website
          npm ci

      - name: Run security audit (npm audit)
        run: |
          cd website
          npm audit --audit-level=moderate || true

      - name: Build website
        run: |
          cd website
          npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@f0a1cd58cd66095dee69bfa18fa5efd1dde93bca  # v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: waddleai-website
          directory: website/out
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Comment deployment URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9
        with:
          script: |
            const deploymentUrl = `https://${context.sha.substring(0, 8)}.waddleai-website.pages.dev`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 **Preview deployment ready!**
              
              📝 **Changes**: Website updates
              🔗 **Preview URL**: ${deploymentUrl}
              
              The preview will be available in ~2 minutes after the build completes.`
            });