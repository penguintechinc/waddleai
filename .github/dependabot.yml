version: 2
updates:
  # Enable version updates for Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "release/v0.2.X"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    groups:
      all-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
      security:
        applies-to: security-updates
        patterns:
          - "*"
    open-pull-requests-limit: 10
    assignees:
      - "waddleai-bot"
    reviewers:
      - "waddleai-team"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    labels:
      - "dependencies"
      - "python"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "release/v0.2.X"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    groups:
      all-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
      security:
        applies-to: security-updates
        patterns:
          - "*"
      # init/analyze/upload-sarif are versioned and released together and
      # must match exactly -- a split bump (e.g. #170 bumping analyze to
      # 4.37.9 while #167 bumped init separately) fails CI with "Loaded a
      # configuration file for version '4.37.6', but running version
      # '4.37.9'". Group them so Dependabot always proposes one PR.
      codeql-action:
        patterns:
          - "github/codeql-action/*"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"

  # Enable version updates for Docker
  - package-ecosystem: "docker"
    directories:
      - "/proxy"
      - "/services/management"
    target-branch: "release/v0.2.X"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    groups:
      all-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
      security:
        applies-to: security-updates
        patterns:
          - "*"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "docker"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"
    ignore:
      # Hold the base images (/proxy, /services/management) on the 3.13 line. The house standard is Python
      # 3.13.x and CI runs 3.13, so a 3.14 image would put the container ahead
      # of both and diverge from what the test job actually exercises.
      # Patch and minor updates within 3.13 still come through normally.
      # Remove this once the standard moves to 3.14.
      - dependency-name: "python"
        versions: [">=3.14"]
