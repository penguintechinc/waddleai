version: 2
updates:
  # Enable version updates for Python dependencies
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    open-pull-requests-limit: 10
    assignees:
      - "waddleai-bot"
    reviewers:
      - "waddleai-team"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    labels:
      - "dependencies"
      - "python"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"

  # Enable version updates for Docker
  - package-ecosystem: "docker"
    directory: "/proxy"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "docker"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"
    ignore:
      # Hold the base image on the 3.13 line. The house standard is Python
      # 3.13.x and CI runs 3.13, so a 3.14 image would put the container ahead
      # of both and diverge from what the test job actually exercises.
      # Patch and minor updates within 3.13 still come through normally.
      # Remove this once the standard moves to 3.14.
      - dependency-name: "python"
        versions: [">=3.14"]

  # Path is services/management, not management — the service moved during the
  # Phase-1 consolidation. The old entry pointed at a directory that no longer
  # exists, so Dockerfile updates for this service were silently never scanned.
  - package-ecosystem: "docker"
    directory: "/services/management"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "docker"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"
    ignore:
      # Same 3.13 hold as the proxy image above.
      - dependency-name: "python"
        versions: [">=3.14"]