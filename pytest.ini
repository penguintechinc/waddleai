[pytest]
asyncio_mode = auto
testpaths = tests
markers =
    integration: marks tests as integration tests that require live services (deselect with '-m "not integration"')
    gpu: marks tests that need a real GPU-backed model (e.g. gemma4:e2b) -- nightly/GPU CI tier only, deselected by default
addopts =
    -v
    --cov=shared
    --cov=services/management/app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-config=.coveragerc
    -p no:warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
