version: '3.8'

services:
  # PostgreSQL Database - Shared by all services
  postgres:
    image: postgres:15
    container_name: waddleai-dev-postgres
    environment:
      POSTGRES_DB: waddleai
      POSTGRES_USER: waddleai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    # NO PUBLIC PORTS - Internal only! Services communicate via waddleai-dev network
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waddleai"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - waddleai-dev

  # Redis - Routing instructions + caching
  redis:
    image: redis:7-alpine
    container_name: waddleai-dev-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-devredis}
    volumes:
      - redis_dev_data:/data
    # NO PUBLIC PORTS - Internal only! Services communicate via waddleai-dev network
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-devredis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - waddleai-dev

  # ChromaDB - mem0 conversation storage
  chromadb:
    image: ghcr.io/chroma-core/chroma:latest
    container_name: waddleai-dev-chromadb
    volumes:
      - chromadb_dev_data:/chroma/chroma
    # NO PUBLIC PORTS - Internal only! Services communicate via waddleai-dev network
    expose:
      - "8000"
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - waddleai-dev

  # WaddleAI Proxy Server - API Gateway with optional XDP support
  waddleai-proxy:
    build:
      context: .
      dockerfile: proxy/Dockerfile
    container_name: waddleai-dev-proxy
    # Uncomment below for XDP support (requires privileged mode and host networking)
    # privileged: true
    # network_mode: host
    # cap_add:
    #   - NET_ADMIN
    #   - SYS_ADMIN
    ports:
      - "8000:8000"  # PUBLIC: Main API endpoint (OpenAI, Claude, MCP protocols)
    environment:
      - DATABASE_URL=postgresql://waddleai:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/waddleai
      - REDIS_URL=redis://:${REDIS_PASSWORD:-devredis}@redis:6379/0
      - MANAGEMENT_SERVER_URL=http://waddleai-mgmt:8001
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret-change-in-production}
      - SECURITY_POLICY=balanced
      - ROUTING_LLM=${ROUTING_LLM:-llama3.2:1b}
      - CHROMADB_URL=http://chromadb:8000
      - ENABLE_XDP=${ENABLE_XDP:-false}
      - XDP_INTERFACE=${XDP_INTERFACE:-eth0}
      - ENABLE_AF_XDP=${ENABLE_AF_XDP:-false}
      - LOG_LEVEL=DEBUG
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      waddleai-mgmt:
        condition: service_started
    volumes:
      - ./proxy:/app/proxy:ro
      - ./shared:/app/shared:ro
      - proxy_dev_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - waddleai-dev

  # WaddleAI Management Server - Admin Portal
  waddleai-mgmt:
    build:
      context: .
      dockerfile: management/Dockerfile
    container_name: waddleai-dev-mgmt
    ports:
      - "8002:8001"  # PUBLIC: Management portal with authentication required
    environment:
      - DATABASE_URL=postgresql://waddleai:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/waddleai
      - REDIS_URL=redis://:${REDIS_PASSWORD:-devredis}@redis:6379/1
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret-change-in-production}
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - MCP_AUTO_START=${MCP_AUTO_START:-true}
      - MCP_PORT=8765
      - LOG_LEVEL=DEBUG
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./management:/app/management:ro
      - ./shared:/app/shared:ro
      - mgmt_dev_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - waddleai-dev

  # Ollama - Local LLM Provider (Optional but recommended for development)
  ollama:
    image: ollama/ollama:latest
    container_name: waddleai-dev-ollama
    # NO PUBLIC PORTS - Internal only! Proxy communicates via waddleai-dev network
    expose:
      - "11434"
    volumes:
      - ollama_dev_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    restart: unless-stopped
    networks:
      - waddleai-dev
    # Uncomment below for GPU support (NVIDIA)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # MkDocs Documentation Site
  docs:
    build:
      context: ./docs/docs-site
      dockerfile: Dockerfile
    container_name: waddleai-dev-docs
    ports:
      - "8081:8080"  # PUBLIC: Documentation site (can be removed in production)
    volumes:
      - ./docs:/docs:ro
    restart: unless-stopped
    networks:
      - waddleai-dev

  # Prometheus - Metrics Collection (Optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: waddleai-dev-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    # NO PUBLIC PORTS - Internal only! Access metrics via Grafana
    expose:
      - "9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_dev_data:/prometheus
    restart: unless-stopped
    networks:
      - waddleai-dev

  # Grafana - Metrics Visualization (Optional)
  grafana:
    image: grafana/grafana:latest
    container_name: waddleai-dev-grafana
    ports:
      - "3333:3000"  # PUBLIC: Grafana UI with authentication (optional in production)
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=redis-datasource
    volumes:
      - grafana_dev_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - waddleai-dev

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local
  chromadb_dev_data:
    driver: local
  ollama_dev_data:
    driver: local
  proxy_dev_logs:
    driver: local
  mgmt_dev_logs:
    driver: local
  prometheus_dev_data:
    driver: local
  grafana_dev_data:
    driver: local

networks:
  waddleai-dev:
    driver: bridge
    name: waddleai-development