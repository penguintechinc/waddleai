[package]
name = "tokens"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "WaddleAI token counting (tiktoken parity), conversion rates, TokenLimiter, and TokenBudgetStage"

[dependencies]
db = { path = "../db", version = "=0.1.0" }
pipeline = { path = "../pipeline", version = "=0.1.0" }
async-trait = "=0.1.92"
chrono = { version = "=0.4.45", default-features = false, features = ["std", "clock"] }
redis = { version = "=1.7.0", default-features = false, features = ["tokio-comp", "aio", "script"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
tiktoken-rs = { version = "=0.12.1", default-features = false }
tokio = { version = "=1.54.1", features = ["time", "sync", "rt"] }
tracing = "=0.1.44"
uuid = { version = "=1.29.0", features = ["v4"] }

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "time"] }
