[package]
name = "routing"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "WaddleAI smart-routing decision logic (RoutingStage) and the Valkey-invalidated registry cache"

[dependencies]
cache = { path = "../cache", version = "=0.1.0" }
db = { path = "../db", version = "=0.1.0" }
pipeline = { path = "../pipeline", version = "=0.1.0" }
async-trait = "=0.1.92"
opentelemetry = { version = "=0.33.1", features = ["metrics"] }
sea-orm = { version = "=2.0.4", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-json"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
tiktoken-rs = { version = "=0.12.1", default-features = false }
tokio = { version = "=1.54.1", features = ["time", "sync", "rt"] }
tracing = "=0.1.44"

[dev-dependencies]
rstest = { version = "=0.27.0", default-features = false }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "time"] }
