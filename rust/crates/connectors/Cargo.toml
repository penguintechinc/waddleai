[package]
name = "connectors"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "WaddleAI local LLM connectors (Ollama, llama.cpp), the LocalDispatcher and the DispatchStage"

[dependencies]
pipeline = { path = "../pipeline", version = "=0.1.0" }
routing = { path = "../routing", version = "=0.1.0" }
async-stream = "=0.3.6"
async-trait = "=0.1.92"
bytes = "=1.12.1"
futures-core = "=0.3.34"
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
http = "=1.5.0"
httpdate = "=1.0.3"
opentelemetry = { version = "=0.33.1", features = ["metrics"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
secrecy = "=0.10.3"
serde_json = "=1.0.154"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["time", "sync", "rt"] }
tracing = "=0.1.44"

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["registry", "std"] }
opentelemetry_sdk = { version = "=0.33.1", features = ["metrics", "testing"] }
wiremock = "=0.6.5"
