[package]
name = "metering"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "WaddleAI usage metering: batched token_usage buffer, quota ledger, and the MeterStage (finalize/reconcile)"

[dependencies]
db = { path = "../db", version = "=0.1.0" }
pipeline = { path = "../pipeline", version = "=0.1.0" }
quota = { path = "../quota", version = "=0.1.0" }
telemetry = { path = "../telemetry", version = "=0.1.0" }
tokens = { path = "../tokens", version = "=0.1.0" }
async-trait = "=0.1.92"
chrono = { version = "=0.4.45", default-features = false, features = ["std", "clock"] }
sea-orm = { version = "=2.0.4", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-json", "with-chrono"] }
serde = "=1.0.229"
serde_json = "=1.0.154"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["time", "sync", "rt"] }
tracing = "=0.1.44"

[dev-dependencies]
auth = { path = "../auth", version = "=0.1.0" }
sea-orm = { version = "=2.0.4", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-json", "with-chrono", "mock"] }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "time", "test-util"] }
