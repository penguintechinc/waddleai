[package]
name = "pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "WaddleAI proxy pipeline: Stage trait, PipelineContext, driver, and P3/P4 seam traits"

[dependencies]
auth = { path = "../auth", version = "=0.1.0" }
flags = { path = "../flags", version = "=0.1.0" }
async-trait = "=0.1.92"
bytes = "=1.12.1"
futures-core = "=0.3.34"
secrecy = "=0.10.3"
serde_json = "=1.0.154"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["time", "sync", "rt"] }
tracing = "=0.1.44"

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "time"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["registry", "std"] }
