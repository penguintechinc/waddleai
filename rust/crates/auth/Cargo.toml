[package]
name = "auth"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "WaddleAI wa- API-key auth (O(1) lookup, bcrypt) and JWKS/JWT validation"

[dependencies]
db = { path = "../db", version = "=0.1.0" }
bcrypt = "=0.19.3"
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["aws_lc_rs"] }
sea-orm = { version = "=2.0.4", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-uuid", "with-chrono", "with-json", "with-rust_decimal"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["time", "sync", "rt"] }
tracing = "=0.1.44"

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "time"] }
base64 = "=0.22.1"
aws-lc-rs = "=1.19.0"
