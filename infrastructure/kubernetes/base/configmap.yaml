---
apiVersion: v1
kind: ConfigMap
metadata:
  name: waddleai-config
  namespace: waddleai
  labels:
    app: waddleai
data:
  # Database Configuration
  DB_TYPE: "postgres"
  POSTGRES_HOST: "postgres.waddleai.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "waddleai"

  # Redis Configuration
  REDIS_HOST: "redis.waddleai.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_DB: "0"

  # MarchProxy AILB Integration
  MARCHPROXY_AILB_HOST: "proxy-ailb.marchproxy.svc.cluster.local"
  MARCHPROXY_AILB_GRPC_PORT: "50051"
  MARCHPROXY_AILB_HTTP_PORT: "8080"
  MARCHPROXY_AILB_TLS_ENABLED: "false"

  # Webhook Configuration
  WEBHOOK_CALLBACK_URL: "http://waddleai-mgmt.waddleai.svc.cluster.local:8001/api/v1/webhooks/ailb/usage"

  # Ollama Management
  OLLAMA_MANAGEMENT_MODE: "manual"

  # Feature Flags
  ENABLE_OLLAMA_MANAGEMENT: "true"
  ENABLE_USAGE_WEBHOOKS: "true"
  ENABLE_GEMINI: "true"
  ENABLE_BEDROCK: "true"
  ENABLE_AZURE_OPENAI: "true"
  ENABLE_COHERE: "true"

  # Flask Configuration
  FLASK_ENV: "production"
  FLASK_DEBUG: "false"
