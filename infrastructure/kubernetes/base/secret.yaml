---
apiVersion: v1
kind: Secret
metadata:
  name: waddleai-secrets
  namespace: waddleai
  labels:
    app: waddleai
type: Opaque
stringData:
  # Database Credentials
  POSTGRES_USER: "waddleai"
  POSTGRES_PASSWORD: "CHANGE_ME_IN_PRODUCTION"

  # Redis Password (if needed)
  REDIS_PASSWORD: ""

  # JWT Secrets
  JWT_SECRET: "CHANGE_ME_GENERATE_RANDOM_32_CHARS"
  FLASK_SECRET_KEY: "CHANGE_ME_GENERATE_RANDOM_32_CHARS"

  # Webhook Secret
  WEBHOOK_SECRET: "CHANGE_ME_SHARED_SECRET_WITH_AILB"

  # License Configuration (optional)
  LICENSE_KEY: ""
  LICENSE_SERVER_URL: "https://license.penguintech.io"
  PRODUCT_NAME: "waddleai"
  RELEASE_MODE: "false"
