---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: waddleai

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - postgres-deployment.yaml
  - redis-deployment.yaml
  - management-deployment.yaml
  - ingress.yaml

commonLabels:
  app: waddleai
  managed-by: kustomize

images:
  - name: ghcr.io/penguintechinc/waddleai/management
    newTag: beta-latest
