---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: waddleai-ingress
  namespace: waddleai
  labels:
    app: waddleai
  annotations:
    # Ingress class
    kubernetes.io/ingress.class: "nginx"

    # Cert-manager annotations for wildcard certificate
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    cert-manager.io/common-name: "waddleai.beta.k8s.cluster"

    # Nginx specific annotations
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"

    # CORS configuration
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization"

    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "100"

    # Timeouts
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"

    # Body size
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  tls:
  - hosts:
    - waddleai.beta.k8s.cluster
    - "*.waddleai.beta.k8s.cluster"
    secretName: waddleai-tls-wildcard
  rules:
  - host: waddleai.beta.k8s.cluster
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: waddleai-mgmt
            port:
              number: 8001
  - host: api.waddleai.beta.k8s.cluster
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: waddleai-mgmt
            port:
              number: 8001
  - host: mgmt.waddleai.beta.k8s.cluster
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: waddleai-mgmt
            port:
              number: 8001
