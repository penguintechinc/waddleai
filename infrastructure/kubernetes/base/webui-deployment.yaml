---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: waddleai-webui
  namespace: waddleai
  labels:
    app: waddleai
    component: webui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: waddleai
      component: webui
  template:
    metadata:
      labels:
        app: waddleai
        component: webui
    spec:
      containers:
      - name: webui
        image: registry-dal2.penguintech.io/waddleai/webui:beta-latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        env:
        - name: API_BASE_URL
          value: "/api"
        - name: VITE_API_BASE_URL
          value: "/api"
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: waddleai-webui
  namespace: waddleai
  labels:
    app: waddleai
    component: webui
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    name: http
    protocol: TCP
  selector:
    app: waddleai
    component: webui
