services:
  postgres:
    environment:
    - POSTGRES_DB=waddleai
    - POSTGRES_USER=waddleai
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
    healthcheck:
      interval: 10s
      retries: 5
      test:
      - CMD-SHELL
      - pg_isready -U waddleai -d waddleai
      timeout: 5s
    image: pgvector/pgvector:pg16@sha256:7d400e340efb42f4d8c9c12c6427adb253f726881a9985d2a471bf0eed824dff
    restart: unless-stopped
    volumes:
    - postgres_data:/var/lib/postgresql/data
    - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
  redis:
    command: redis-server --appendonly yes
    healthcheck:
      interval: 10s
      retries: 3
      test:
      - CMD
      - redis-cli
      - ping
      timeout: 5s
    image: redis:7-bookworm@sha256:a5995dfdf108997f8a7c9587f54fad5e94ed5848de5236a6b28119e99efd67e0@sha256:a5995dfdf108997f8a7c9587f54fad5e94ed5848de5236a6b28119e99efd67e0
    restart: unless-stopped
    volumes:
    - redis_data:/data
  waddleai-mgmt:
    build:
      context: ./services/management
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
    - DATABASE_URL=postgres://waddleai:${POSTGRES_PASSWORD:-password}@postgres:5432/waddleai
    - DB_TYPE=postgres
    - JWT_SECRET=${JWT_SECRET:-change-in-production-min-32-chars}
    - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-flask-secret-key-change-me}
    - REDIS_URL=redis://redis:6379/0
    - MARCHPROXY_AILB_HOST=${MARCHPROXY_AILB_HOST:-localhost}
    - MARCHPROXY_AILB_GRPC_PORT=${MARCHPROXY_AILB_GRPC_PORT:-50051}
    - MARCHPROXY_AILB_HTTP_PORT=${MARCHPROXY_AILB_HTTP_PORT:-8080}
    - MARCHPROXY_AILB_TLS_ENABLED=${MARCHPROXY_AILB_TLS_ENABLED:-false}
    - WEBHOOK_SECRET=${WEBHOOK_SECRET:-shared-secret-for-ailb-webhooks}
    - WEBHOOK_CALLBACK_URL=${WEBHOOK_CALLBACK_URL:-http://waddleai-mgmt:8001/api/v1/webhooks/ailb/usage}
    - OLLAMA_MANAGEMENT_MODE=${OLLAMA_MANAGEMENT_MODE:-both}
    - DOCKER_HOST=${DOCKER_HOST:-unix:///var/run/docker.sock}
    - ENABLE_OLLAMA_MANAGEMENT=${ENABLE_OLLAMA_MANAGEMENT:-true}
    - ENABLE_USAGE_WEBHOOKS=${ENABLE_USAGE_WEBHOOKS:-true}
    - ENABLE_GEMINI=${ENABLE_GEMINI:-true}
    - ENABLE_BEDROCK=${ENABLE_BEDROCK:-true}
    - ENABLE_AZURE_OPENAI=${ENABLE_AZURE_OPENAI:-true}
    - ENABLE_COHERE=${ENABLE_COHERE:-true}
    healthcheck:
      interval: 30s
      retries: 3
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8001/healthz
      timeout: 10s
    ports:
    - 8001:8001
    restart: unless-stopped
    user: root
    volumes:
    - ./config/marchproxy:/app/config/marchproxy
    - ./services/management/logs:/app/logs
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - waddleai_databases:/app/databases
  waddleai-webui:
    build:
      context: ./services/webui
      dockerfile: Dockerfile
    depends_on:
    - waddleai-mgmt
    ports:
    - 8003:8080
    restart: unless-stopped
version: '3.8'
volumes:
  postgres_data: null
  redis_data: null
  waddleai_databases: null
