[package]
name = "waddleai-cli"
version = "0.1.0"
edition = "2021"
description = "WaddleAI CLI and MCP stdio shim -- a thin client over /api/v1 and /mcp"
license = "AGPL-3.0-only"
repository = "https://github.com/penguintechinc/waddleai"
default-run = "waddleai"

[[bin]]
name = "waddleai"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
dirs = "6.0.0"
futures-util = "0.3.34"
keyring = { version = "4.1.6", features = [
    "apple-native-keyring-store",
    "windows-native-keyring-store",
    "zbus-secret-service-keyring-store",
] }
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "stream",
    "multipart",
    "form",
    "rustls",
] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
tiny_http = "0.12.0"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.11.0", features = ["v4", "serde"] }
webbrowser = "1.2.4"

[dev-dependencies]
wiremock = "0.6.5"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
