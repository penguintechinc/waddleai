server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

    # Security headers.
    #
    # nginx's add_header is NOT additive across contexts: a location block that
    # declares any add_header of its own drops every header inherited from the
    # server block. Every location below that sets a header therefore repeats
    # this block verbatim -- dropping the repetition silently un-protects that
    # location. Keep the four in sync.
    #
    # X-XSS-Protection is deliberately absent: the legacy auditor it enabled is
    # removed from every current browser and its remaining implementations
    # introduced their own XSS vectors. CSP below is the replacement.
    #
    # CSP notes for this SPA (Vite-built React, served from this same origin):
    #   script-src 'self'      -- index.html loads one external module bundle;
    #                             there is no inline <script>, so no nonce or
    #                             'unsafe-inline' is needed.
    #   style-src 'unsafe-inline' -- required: component libraries inject
    #                             <style> elements at runtime. React's
    #                             style={{...}} props go through CSSOM and are
    #                             not governed by CSP, but the injected sheets
    #                             are.
    #   connect-src 'self'     -- the API is same-origin via the /api proxy
    #                             below; no cross-origin XHR target exists.
    #   img-src data:          -- inline data-URI icons/charts.
    #   frame-ancestors 'self' -- the CSP equivalent of the X-Frame-Options
    #                             SAMEORIGIN kept below for older browsers.
    # HSTS is emitted even though this listener is plain HTTP behind a
    # TLS-terminating ingress: browsers ignore the header on an http:// origin,
    # and it is honored once the response reaches the client over https.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'" always;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Repeated: this location's own add_header drops the server-level set.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'" always;
    }

    # API proxy - use environment variable to switch between local and k8s
    location /api {
        resolver 127.0.0.11 valid=10s;
        set $backend_host "waddleai-mgmt";
        set $backend_port "8001";
        proxy_pass http://$backend_host:$backend_port;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
        # Repeated: this location's own add_header drops the server-level set.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'" always;
    }
}
