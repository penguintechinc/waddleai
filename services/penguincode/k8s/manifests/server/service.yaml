apiVersion: v1
kind: Service
metadata:
  name: penguincode-server
  labels:
    app: penguincode
    component: server
spec:
  type: ClusterIP
  selector:
    app: penguincode
    component: server
  ports:
  - name: grpc
    port: 50051
    targetPort: grpc
    protocol: TCP
  - name: rest
    port: 8080
    targetPort: rest
    protocol: TCP
