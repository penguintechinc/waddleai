# Alpha environment values for penguincode
# Minimal resources, local images, debug enabled

global:
  namespace: penguincode-alpha

image:
  repository: penguincode/server
  pullPolicy: Never
  tag: latest

server:
  replicas: 1

  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

  env:
    PENGUINCODE_SERVER_MODE: "standalone"
    PENGUINCODE_AUTH_ENABLED: "false"
    PENGUINCODE_SECURITY_LEVEL: "1"
    PENGUINCODE_VRAM_MB: "4096"
    PENGUINCODE_MAX_CONCURRENT: "1"
    PENGUINCODE_MAX_MODELS: "1"
    PENGUINCODE_USE_ENV_CONFIG: "true"
    OLLAMA_HOST: "localhost:11434"

ollama:
  enabled: false

secrets:
  enabled: false

# Local alpha Postgres (same shared-schema contract as beta/prod) --
# operator creates this Secret out-of-band before `helm install`:
#   kubectl create secret generic penguincode-postgres-alpha \
#     --namespace penguincode-alpha \
#     --from-literal=PGVECTOR_URL=postgresql://penguincode:...@waddleai-postgres.waddleai.svc.cluster.local:5432/waddleai
postgres:
  existingSecret: penguincode-postgres-alpha

# Flags stay OFF in alpha too (ship dark; flip on per environment only after
# validation -- spec §14 Rollout). POSTHOG_KEY is optional; leave unset to
# fall back to env overrides / OFF (flags/client.py graceful degradation).

migration:
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

ingress:
  enabled: false
