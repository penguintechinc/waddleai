{{- if .Values.server.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "penguincode.fullname" . }}-server
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "penguincode.server.labels" . | nindent 4 }}
spec:
  # O4-Low: omitted entirely when autoscaling is enabled -- otherwise every
  # `helm upgrade` resets replicas back to server.replicas and fights the
  # HPA's own scaling decisions (see templates/hpa.yaml, k8s/helm/waddleai's
  # management-deployment.yaml for the identical pattern).
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.server.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "penguincode.server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "penguincode.server.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "penguincode.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: server
        securityContext:
          {{- toYaml .Values.securityContext | nindent 12 }}
        image: {{ include "penguincode.image" . | quote }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: grpc
          containerPort: {{ .Values.server.service.port }}
          protocol: {{ .Values.server.service.protocol }}
        - name: rest
          containerPort: 8080
          protocol: TCP
        env:
        # LEAST-PRIVILEGE app-role DSN (spec §9) -- the `penguincode_app` role
        # created by templates/role-bootstrap-job.yaml, scoped to ONLY the
        # `penguincode` schema on the shared WaddleAI Postgres. NEVER the
        # admin DSN (that's migration/bootstrap-only, see those templates)
        # and NEVER the `waddleai` app role. Required: secretKeyRef only,
        # never inline plaintext, never a CLI arg (token/secret hygiene).
        - name: PGVECTOR_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "penguincode.postgresSecretName" . }}
              key: {{ .Values.postgres.secretKey }}
        # PostHog feature-flag API key (flags/client.py) -- optional: absent
        # POSTHOG_KEY is a deliberate "flags default OFF" state, not an outage.
        - name: POSTHOG_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "penguincode.posthogSecretName" . }}
              key: {{ .Values.flags.posthog.secretKey }}
              optional: true
        # OTLP exporter auth headers (observability/otel.py) -- optional; most
        # in-cluster collectors need no auth header.
        - name: OTEL_EXPORTER_OTLP_HEADERS
          valueFrom:
            secretKeyRef:
              name: {{ include "penguincode.otelHeadersSecretName" . }}
              key: {{ .Values.otel.headers.secretKey }}
              optional: true
        # O9: gRPC server thread-pool size -- was hardcoded `max_workers=10`
        # in penguincode_cli/server/main.py's grpc.aio.server(...). Reading
        # this env var server-side is a separate, non-Helm change (tracked
        # outside this PR); default below matches today's hardcoded value.
        - name: PENGUINCODE_GRPC_MAX_WORKERS
          value: {{ .Values.server.grpcMaxWorkers | default 10 | quote }}
        envFrom:
        {{- if .Values.configMap.enabled }}
        - configMapRef:
            name: {{ include "penguincode.fullname" . }}-config
        {{- end }}
        {{- if .Values.secrets.enabled }}
        - secretRef:
            name: {{ include "penguincode.fullname" . }}-secrets
        {{- end }}
        {{- if .Values.server.healthCheck.enabled }}
        {{- /*
        O4: nativeGrpcProbe (default OFF, see values.yaml comment) swaps
        both probes to K8s's native `grpc:` probe type against the standard
        grpc.health.v1.Health service -- readiness checks the knowledge
        service specifically (the capability this server exists to provide),
        liveness checks overall server health (empty service name). Stays on
        the exec/grpc.channel_ready_future check otherwise, which only
        proves the channel accepts connections, not that the server is
        actually serving -- a known, documented gap (values.yaml) until
        grpc.health.v1 is registered server-side.
        */}}
        {{- if .Values.server.healthCheck.nativeGrpcProbe }}
        livenessProbe:
          grpc:
            port: {{ .Values.server.healthCheck.grpc.port }}
            service: {{ .Values.server.healthCheck.grpcServiceName | default "" | quote }}
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          grpc:
            port: {{ .Values.server.healthCheck.grpc.port }}
            service: "penguincode.knowledge.v1.KnowledgeService"
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        {{- else }}
        livenessProbe:
          exec:
            command:
            - python
            - -c
            - |
              import grpc
              ch = grpc.insecure_channel('localhost:{{ .Values.server.healthCheck.grpc.port }}')
              grpc.channel_ready_future(ch).result(timeout=5)
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          exec:
            command:
            - python
            - -c
            - |
              import grpc
              ch = grpc.insecure_channel('localhost:{{ .Values.server.healthCheck.grpc.port }}')
              grpc.channel_ready_future(ch).result(timeout=5)
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        {{- end }}
        {{- end }}
        {{- if .Values.server.startupProbe.enabled }}
        startupProbe:
          exec:
            command:
            - python
            - -c
            - |
              import grpc
              ch = grpc.insecure_channel('localhost:{{ .Values.server.healthCheck.grpc.port }}')
              grpc.channel_ready_future(ch).result(timeout=5)
          initialDelaySeconds: {{ .Values.server.startupProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.server.startupProbe.periodSeconds }}
          timeoutSeconds: {{ .Values.server.startupProbe.timeoutSeconds }}
          failureThreshold: {{ .Values.server.startupProbe.failureThreshold }}
        {{- end }}
        {{- with .Values.server.preStopSleepSeconds }}
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep {{ . }}"]
        {{- end }}
        resources:
          {{- toYaml .Values.server.resources | nindent 12 }}
      {{- with .Values.server.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "penguincode.fullname" . }}-server
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "penguincode.server.labels" . | nindent 4 }}
  {{- with .Values.server.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.server.service.type }}
  ports:
  - port: {{ .Values.server.service.port }}
    targetPort: grpc
    protocol: {{ .Values.server.service.protocol }}
    name: grpc
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: rest
  selector:
    {{- include "penguincode.server.selectorLabels" . | nindent 4 }}
{{- end }}
