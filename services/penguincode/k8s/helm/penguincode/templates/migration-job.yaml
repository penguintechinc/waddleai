{{/*
Idempotent schema/migration init Job (penguincode_cli/db/migrate.py, T1 -- spec §9, §11).
Runs as a Helm pre-install/pre-upgrade hook, AFTER the role-bootstrap Job
(hook-weight -5 vs. -10), so the `penguincode` Postgres schema, extension
guard, tables, and indexes exist in the shared WaddleAI Postgres BEFORE the
server Deployment rolls out. penguincode has no Alembic and is intentionally
not coupled to services/management's migration tooling -- every migration
file under penguincode_cli/db/migrations/ is itself idempotent, and
penguincode_cli/db/migrate.py tracks applied versions in penguincode.schema_migrations, so
re-running this Job on every upgrade is always safe.

Runs with the ADMIN DSN (postgres.adminExistingSecret), not the least-priv
app-role DSN: migration 0001_schema_and_extension.sql runs `CREATE EXTENSION
IF NOT EXISTS vector`, which requires admin/superuser privilege the app role
never holds (see templates/role-bootstrap-job.yaml). Tables this Job creates
inside the `penguincode` schema are covered by the ALTER DEFAULT PRIVILEGES
grants the role-bootstrap Job establishes for the same admin connection, so
they remain usable by the least-priv `penguincode_app` role the server uses.
*/}}
{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "penguincode.fullname" . }}-migrate
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "penguincode.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "penguincode.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "penguincode.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "penguincode.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command: ["python3", "-m", "penguincode_cli.db.migrate"]
          env:
            # ADMIN DSN, not the server's least-priv app-role DSN -- see the
            # template header comment above. Required: secretKeyRef only,
            # never inline plaintext, never a CLI arg (token/secret hygiene).
            - name: PGVECTOR_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "penguincode.postgresAdminSecretName" . }}
                  key: {{ .Values.postgres.adminSecretKey }}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
