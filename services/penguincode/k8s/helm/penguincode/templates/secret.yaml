{{/*
Renders whenever there's something to put in it: the legacy JWT/API-key
group (secrets.enabled), or any of postgres/posthog/otel where the chart is
asked to manage the value directly (no existingSecret set). When every
sensitive value comes from an existingSecret created out-of-band, this
resource is skipped entirely rather than emitting an empty Secret.
*/}}
{{- if or .Values.secrets.enabled
         (and (not .Values.postgres.existingSecret) .Values.postgres.dsn)
         (and (not .Values.postgres.adminExistingSecret) .Values.postgres.adminDsn)
         (and (not .Values.postgres.bootstrapRole.passwordExistingSecret) .Values.postgres.bootstrapRole.password)
         (and (not .Values.flags.posthog.existingSecret) .Values.flags.posthog.apiKey)
         (and (not .Values.otel.headers.existingSecret) .Values.otel.headers.value) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "penguincode.fullname" . }}-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "penguincode.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.JWT_SECRET }}
  JWT_SECRET: {{ .Values.secrets.JWT_SECRET }}
  {{- end }}
  {{- if .Values.secrets.PENGUINCODE_API_KEY }}
  PENGUINCODE_API_KEY: {{ .Values.secrets.PENGUINCODE_API_KEY }}
  {{- end }}
  {{/*
  PGVECTOR_URL / POSTHOG_KEY / OTEL_EXPORTER_OTLP_HEADERS are only rendered
  here when the chart manages the value directly (no existingSecret set).
  Preferred path in every shared environment is postgres.existingSecret /
  flags.posthog.existingSecret / otel.headers.existingSecret pointing at a
  Secret created out-of-band -- never a plaintext value committed to a
  values file. See _helpers.tpl penguincode.*SecretName.
  */}}
  {{- if and (not .Values.postgres.existingSecret) .Values.postgres.dsn }}
  {{ .Values.postgres.secretKey }}: {{ .Values.postgres.dsn | b64enc }}
  {{- end }}
  {{- if and (not .Values.postgres.adminExistingSecret) .Values.postgres.adminDsn }}
  {{ .Values.postgres.adminSecretKey }}: {{ .Values.postgres.adminDsn | b64enc }}
  {{- end }}
  {{- if and (not .Values.postgres.bootstrapRole.passwordExistingSecret) .Values.postgres.bootstrapRole.password }}
  {{ .Values.postgres.bootstrapRole.passwordSecretKey }}: {{ .Values.postgres.bootstrapRole.password | b64enc }}
  {{- end }}
  {{- if and (not .Values.flags.posthog.existingSecret) .Values.flags.posthog.apiKey }}
  {{ .Values.flags.posthog.secretKey }}: {{ .Values.flags.posthog.apiKey | b64enc }}
  {{- end }}
  {{- if and (not .Values.otel.headers.existingSecret) .Values.otel.headers.value }}
  {{ .Values.otel.headers.secretKey }}: {{ .Values.otel.headers.value | b64enc }}
  {{- end }}
{{- end }}
