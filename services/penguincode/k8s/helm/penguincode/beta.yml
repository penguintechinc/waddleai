# Beta environment values for penguincode
# Production-like setup with registry images

global:
  namespace: penguincode

image:
  repository: ghcr.io/penguintechinc/penguincode
  pullPolicy: IfNotPresent
  # CI-set on every merge to main, e.g. `beta-1727308800` (epoch64) -- see
  # devops.md CI/CD Tag Naming. Never `latest`.
  tag: "beta-0000000000"

imagePullSecrets:
  - name: ghcr-pull-secret

server:
  replicas: 2

  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi

  env:
    PENGUINCODE_SERVER_MODE: "standalone"
    PENGUINCODE_AUTH_ENABLED: "true"
    PENGUINCODE_SECURITY_LEVEL: "2"
    PENGUINCODE_VRAM_MB: "8192"
    PENGUINCODE_MAX_CONCURRENT: "2"
    PENGUINCODE_MAX_MODELS: "1"
    PENGUINCODE_USE_ENV_CONFIG: "true"

ollama:
  enabled: false

secrets:
  enabled: true

# Shared WaddleAI Postgres, least-privilege role (spec §9; see values.yaml
# postgres RUNBOOK comment for the full 3-secret contract) -- all three
# created out-of-band by CI/CD (External Secrets Operator / sealed-secrets),
# never inline plaintext, never a `--set`/`--set-string` CLI arg (token/secret
# hygiene).
postgres:
  adminExistingSecret: penguincode-postgres-admin-beta
  bootstrapRole:
    passwordExistingSecret: penguincode-approle-password-beta
  existingSecret: penguincode-postgres-beta

# Flags stay OFF in beta too (ship dark; flip on per environment only after
# validation -- spec §14 Rollout).

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
  hosts:
    - host: penguincode.penguintech.cloud
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: penguincode-beta-tls
      hosts:
        - penguincode.penguintech.cloud
