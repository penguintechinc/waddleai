# Default values for penguincode
# This is a YAML-formatted file.

# Global settings. Namespace = product name only, never env-suffixed (the
# environment lives in the context and the values filename, e.g. alpha.yml /
# beta.yml / gamma.yml / production.yml -- never here).
global:
  namespace: penguincode

# Image configuration. `tag: latest` is the Helm-implicit-default placeholder
# only -- every real environment values file (alpha.yml/beta.yml/gamma.yml/
# production.yml) overrides this with its own pinned reference (tier tag or
# SHA256 digest; see critical-rules.md Dependency Pinning).
image:
  repository: penguincode/server
  pullPolicy: IfNotPresent
  tag: latest
  # Immutable SHA256 digest (e.g. "sha256:<digest>") -- takes precedence over
  # `tag` when set (see templates/_helpers.tpl penguincode.image). Required
  # in production (critical-rules.md Dependency Pinning); left empty
  # everywhere else so `tag` is used.
  digest: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Server configuration
server:
  enabled: true
  name: penguincode-server
  replicas: 2

  service:
    type: ClusterIP
    port: 50051
    protocol: TCP
    annotations: {}

  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi

  # gRPC health check configuration
  healthCheck:
    enabled: true
    grpc:
      port: 50051

  # Environment configuration
  env:
    # Ollama connection
    OLLAMA_HOST: "host.docker.internal"
    OLLAMA_TIMEOUT: "120"

    # Server configuration
    PENGUINCODE_SERVER_MODE: "standalone"
    PENGUINCODE_SERVER_HOST: "0.0.0.0"
    PENGUINCODE_SERVER_PORT: "50051"

    # Authentication (disabled by default)
    PENGUINCODE_AUTH_ENABLED: "false"

    # Model configuration
    PENGUINCODE_MODEL_PLANNING: "deepseek-coder:6.7b"
    PENGUINCODE_MODEL_ORCHESTRATION: "gemma4:12b-it-qat"
    PENGUINCODE_MODEL_EXECUTION: "qwen2.5-coder:7b"
    PENGUINCODE_MODEL_EXPLORATION: "gemma4:12b-it-qat"
    PENGUINCODE_MODEL_RESEARCH: "gemma4:e4b"

    # Memory configuration -- pgvector is the platform default (chromadb removed
    # platform-wide, T9: 4 open CVEs, no patched release; spec §11).
    PENGUINCODE_MEMORY_ENABLED: "true"
    PENGUINCODE_MEMORY_STORE: "pgvector"
    PENGUINCODE_EMBEDDING_MODEL: "nomic-embed-text"

    # GPU regulators
    PENGUINCODE_VRAM_MB: "8192"
    PENGUINCODE_MAX_CONCURRENT: "2"
    PENGUINCODE_MAX_MODELS: "1"

    # Security & defaults
    PENGUINCODE_SECURITY_LEVEL: "2"
    PENGUINCODE_TEMPERATURE: "0.7"
    PENGUINCODE_MAX_TOKENS: "4096"

    # Research configuration
    PENGUINCODE_RESEARCH_ENGINE: "duckduckgo"

    # Generate config from ENV
    PENGUINCODE_USE_ENV_CONFIG: "true"

# PostHog feature-flag client (flags/client.py). POSTHOG_KEY is secret-sourced
# (see `flags.posthog` secret wiring + templates/secret.yaml), never placed
# here in plaintext. Host is not sensitive (a URL), rendered into the
# ConfigMap by templates/configmap.yaml.
#
# Knowledge-platform flags (spec §10): default OFF, ship dark -- flip on per
# environment only after validation. Env override name derived by
# flags/client.py: PENGUINCODE_FLAG_<NAME>.
flags:
  posthog:
    host: "https://license.penguintech.io"
    # Preferred: reference a Secret created out-of-band (kubectl/External
    # Secrets Operator). Leave apiKey empty when set.
    existingSecret: ""
    secretKey: POSTHOG_KEY
    # Dev-only convenience fallback -- NEVER commit a real key here, and
    # never pass one via `--set`/`--set-string` (shell history). Use
    # existingSecret in every shared environment.
    apiKey: ""
  rag: false
  codeGraph: false
  knowledgeGraph: false
  memoryGraph: false

# OpenTelemetry (observability/otel.py) -- endpoint is env-configurable, never
# hardcoded (critical-rules.md Observability); empty = no-op providers, never
# crashes (see otel.py). Rendered into the ConfigMap by templates/configmap.yaml.
otel:
  endpoint: ""
  protocol: "grpc"
  serviceName: "penguincode"
  deploymentEnvironment: "production"
  # Optional: auth headers for the OTLP exporter, secret-sourced only (never
  # inline). Leave both existingSecret and value empty to omit the env var
  # entirely (most collectors need no auth header in-cluster).
  headers:
    existingSecret: ""
    secretKey: OTEL_EXPORTER_OTLP_HEADERS
    # Dev-only convenience fallback -- NEVER commit a real header value here,
    # and never pass one via `--set`/`--set-string` (shell history).
    value: ""

# Shared WaddleAI Postgres (pgvector) -- penguincode uses its OWN
# least-privilege role (`penguincode_app`), owning ONLY the `penguincode`
# schema -- NEVER the `waddleai` app role/schema (spec §9). Cross-namespace:
# the WaddleAI Postgres Service lives in the `waddleai` namespace
# (k8s/helm/waddleai/templates/postgres-service.yaml).
#
# RUNBOOK -- what an operator must provision before `helm install`:
#   1. Once per cluster/DB (or let bootstrapRole below do it): an ADMIN
#      Secret (postgres.adminExistingSecret) holding a DSN for a role with
#      CREATEROLE + the ability to CREATE EXTENSION (superuser, or a role
#      granted pg_create_subscription/superuser-equivalent on managed PG).
#      Used ONLY by templates/role-bootstrap-job.yaml and
#      templates/migration-job.yaml -- never the server.
#   2. An app-role password Secret (postgres.bootstrapRole.passwordExistingSecret)
#      holding the plaintext password the bootstrap Job uses in its
#      `CREATE ROLE penguincode_app ... PASSWORD` statement.
#   3. An app DSN Secret (postgres.existingSecret) holding the
#      `penguincode_app` role's connection string, with the SAME password as
#      (2) -- e.g. postgresql://penguincode_app:<same-password>@waddleai-postgres.waddleai.svc.cluster.local:5432/waddleai.
#      Used by the server Deployment only.
#   DBAs who pre-create the role/schema/extension manually out-of-band can
#   set postgres.bootstrapRole.enabled: false and skip (2) -- (1) and (3)
#   are still required (the migration Job always uses the admin DSN).
postgres:
  namespace: waddleai
  serviceName: waddleai-postgres
  port: 5432
  # LEAST-PRIVILEGE app-role DSN -- used by the server Deployment only.
  # Preferred: reference a Secret created out-of-band (kubectl/External
  # Secrets Operator/sealed-secrets) holding the connection DSN.
  existingSecret: ""
  secretKey: PGVECTOR_URL
  # Dev-only convenience fallback -- NEVER commit a real DSN here, and never
  # pass one via `--set`/`--set-string` (shell history, token/secret
  # hygiene). Use existingSecret in every shared environment.
  dsn: ""

  # ADMIN DSN -- used ONLY by the role-bootstrap Job and the migration Job
  # (CREATE ROLE / CREATE EXTENSION / DDL all need elevated privileges).
  # NEVER used by the server Deployment. Preferred: existingSecret created
  # out-of-band, pointing at a superuser/admin-privileged Postgres role on
  # the shared WaddleAI instance (NOT the waddleai app role).
  adminExistingSecret: ""
  adminSecretKey: PGVECTOR_ADMIN_URL
  # Dev-only convenience fallback -- NEVER commit a real DSN here, and never
  # pass one via `--set`/`--set-string` (shell history, token/secret
  # hygiene). Use adminExistingSecret in every shared environment.
  adminDsn: ""

  # One-time least-privilege role bootstrap (templates/role-bootstrap-job.yaml)
  # -- creates the `penguincode_app` role, the `penguincode` schema owned by
  # it, and the `vector` extension (admin-only). Runs as a Helm pre-install
  # hook before the migration Job. Idempotent -- safe on every install/upgrade.
  bootstrapRole:
    enabled: true
    backoffLimit: 3
    activeDeadlineSeconds: 120
    appRoleName: penguincode_app
    schema: penguincode
    # Preferred: reference a Secret created out-of-band holding the
    # plaintext password used in the CREATE ROLE/ALTER ROLE statement --
    # MUST match the password embedded in postgres.existingSecret's app DSN.
    passwordExistingSecret: ""
    passwordSecretKey: PENGUINCODE_APP_ROLE_PASSWORD
    # Dev-only convenience fallback -- NEVER commit a real password here, and
    # never pass one via `--set`/`--set-string` (shell history, token/secret
    # hygiene). Use passwordExistingSecret in every shared environment.
    password: ""
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi

# Idempotent schema/migration init Job (db/migrate.py, T1) -- runs as a Helm
# pre-install/pre-upgrade hook before the server rolls out (spec §9, §11).
migration:
  enabled: true
  backoffLimit: 3
  activeDeadlineSeconds: 300
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

# Cross-namespace CiliumNetworkPolicy egress (spec §9; security.md Kubernetes
# Network Security). Guarded by a live capability check so non-Cilium
# clusters still render/install cleanly (see templates/networkpolicy.yaml).
cilium:
  enabled: true
  networkPolicy:
    enabled: true
  egress:
    # Shared WaddleAI Ollama fleet (embeddings/LLM), cross-namespace. NOTE:
    # the waddleai chart's own `waddleai-allow-fleet-ingress` CiliumNetworkPolicy
    # admits ingress from the AIProxy component only today -- this egress
    # rule is necessary but not sufficient until that ingress policy is
    # extended to admit penguincode too (tracked separately; not owned by
    # this chart).
    ollama:
      enabled: true
      namespace: waddleai
      labels:
        app.kubernetes.io/name: waddleai
        app.kubernetes.io/component: ollama
      port: 11434
    # Additional in-cluster, cross-namespace destinations (e.g. an in-cluster
    # OTel collector Service) as {namespace, matchLabels, ports}.
    extraEndpoints: []
    # External destinations (e.g. a hosted OTLP backend) as {matchName, port}.
    # PostHog CE's default host is allowlisted here; add the OTLP collector's
    # FQDN per environment once OTEL_EXPORTER_OTLP_ENDPOINT is set.
    extraFQDNs:
      - matchName: license.penguintech.io
        port: 443

# Optional Ollama service (disabled by default in production). `tag: latest`
# is the Helm-implicit-default placeholder only -- see the `image:` block
# above; no environment values file should ever enable this with a mutable
# tag (external image -- SHA256 digest required in every environment per
# critical-rules.md Dependency Pinning once enabled).
ollama:
  enabled: false
  name: ollama
  replicas: 1

  image:
    repository: ollama/ollama
    pullPolicy: IfNotPresent
    tag: latest

  service:
    type: ClusterIP
    port: 11434

  resources:
    limits:
      cpu: 4000m
      memory: 8Gi
      nvidia.com/gpu: 1
    requests:
      cpu: 2000m
      memory: 4Gi
      nvidia.com/gpu: 1

  persistence:
    enabled: true
    size: 50Gi
    storageClass: ""

# ConfigMap for environment-based configuration
configMap:
  enabled: true

# Secrets (JWT, API keys - created externally)
secrets:
  enabled: true
  # Values should be base64 encoded
  JWT_SECRET: ""
  PENGUINCODE_API_KEY: ""

# Service account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod annotations
podAnnotations: {}

# Pod security context (PenguinTech baseline; image already runs as a
# non-root `penguin` user -- see Dockerfile.server -- so runAsNonRoot is
# satisfied by the image default without pinning a numeric UID here).
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# Security context (PenguinTech baseline). readOnlyRootFilesystem is left
# false: docker-entrypoint.sh writes /app/config.yaml at container start and
# the docs-RAG page cache defaults under /app/.penguincode (PENGUINCODE_DOCS_CACHE_DIR) --
# flipping this to true needs an emptyDir mount for both paths first
# (tracked as a follow-up, out of T15 scope).
securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Ingress configuration
ingress:
  enabled: false
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: penguincode.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: penguincode-tls
      hosts:
        - penguincode.example.com

# NOTE: the chroma-backed data PVC (persistence:, volumeMounts, and
# PENGUINCODE_CHROMA_PATH/COLLECTION env) has been removed -- penguincode no
# longer stores vectors on a local volume; the shared WaddleAI Postgres
# (`postgres:` above) is the vector + graph store for every environment
# (spec §9, §11).

# Autoscaling
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
