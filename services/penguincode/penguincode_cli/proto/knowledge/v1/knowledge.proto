syntax = "proto3";

// KnowledgeService: the server-side contract for penguincode's knowledge
// platform (docs-RAG indexing, hybrid GraphRAG retrieval, scoped memory,
// and the code graph). The CLI is a thin client of this service -- ALL
// vector/graph/memory work happens server-side (see
// docs/superpowers/plans/2026-09-25-penguincode-knowledge-platform.md).
//
// Scope model (security-critical, do not change casually): every request
// below carries operation parameters ONLY. Tenant/org/team/user identity is
// NEVER a request field -- the server derives its ScopeContext exclusively
// from the caller's validated JWT (see penguincode_cli/auth/scope.py),
// exactly as every store (VectorStore/GraphStore/ScopedMemoryManager)
// already requires. The one caller-supplied exception is `Visibility` (+ a
// `team_id` naming *which of the caller's own teams* to scope a write to)
// on the three write RPCs (Index/MemoryAdd/IndexCode) -- this is the
// caller choosing among its own already-established memberships, not
// supplying an arbitrary tenant/org/team/user; the server still validates
// `team_id` against the JWT's own team list before ever using it (see
// stores/vector.py's `_validate_team_id`, stores/graph.py's
// `_scope_columns`, tools/memory.py's `_validate_team_id`).
package penguincode.knowledge.v1;

import "google/protobuf/struct.proto";

// ==================== Shared enums/messages ====================

// Row/write visibility -- mirrors the three levels enforced by every store
// (VectorStore, GraphStore, ScopedMemoryManager): user < team < tenant.
enum Visibility {
  VISIBILITY_UNSPECIFIED = 0;
  VISIBILITY_USER = 1;
  VISIBILITY_TEAM = 2;
  VISIBILITY_TENANT = 3;
}

// Lifecycle state of an async index job (O10-a: `Index`/`IndexCode` load
// leveling -- see `penguincode_cli/indexing/`'s module docstring). A job
// never transitions back to QUEUED from RUNNING -- one interrupted by a pod
// restart is marked FAILED at the next server startup, never re-queued.
enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_QUEUED = 1;
  JOB_STATE_RUNNING = 2;
  JOB_STATE_SUCCEEDED = 3;
  JOB_STATE_FAILED = 4;
}

// The two kinds of background work the async index-job queue carries --
// mirrors `penguincode_cli/indexing/jobs.py`'s `JobType`.
enum JobType {
  JOB_TYPE_UNSPECIFIED = 0;
  JOB_TYPE_INDEX_DOCS = 1;
  JOB_TYPE_INDEX_CODE = 2;
}

// Supported documentation/code languages -- mirrors
// penguincode_cli/docs_rag/models.py's `Language` enum, verbatim set.
enum Language {
  LANGUAGE_UNSPECIFIED = 0;
  LANGUAGE_PYTHON = 1;
  LANGUAGE_JAVASCRIPT = 2;
  LANGUAGE_TYPESCRIPT = 3;
  LANGUAGE_GO = 4;
  LANGUAGE_RUST = 5;
  LANGUAGE_HCL = 6;
  LANGUAGE_ANSIBLE = 7;
  LANGUAGE_RUBY = 8;
  LANGUAGE_PHP = 9;
  LANGUAGE_DART = 10;
}

// One scored vector-search result -- mirrors stores/vector.py's `VectorHit`.
message VectorHit {
  string id = 1;
  string document = 2;
  google.protobuf.Struct metadata = 3;
  double score = 4;
}

// One graph node -- mirrors stores/graph.py's `GraphNode`.
message GraphNode {
  string node_type = 1;
  string key = 2;
  google.protobuf.Struct props = 3;
}

// One directed graph edge -- mirrors stores/graph.py's `GraphEdge`.
message GraphEdge {
  string src_type = 1;
  string src_key = 2;
  string dst_type = 3;
  string dst_key = 4;
  string rel_type = 5;
  google.protobuf.Struct props = 6;
}

// One graph-kind expansion result -- mirrors stores/graph.py's `Subgraph`.
message Subgraph {
  repeated GraphNode nodes = 1;
  repeated GraphEdge edges = 2;
}

// ==================== KnowledgeService ====================

service KnowledgeService {
  // Index documentation for a library or a language's core docs. Mirrors
  // `docs_rag.indexer.DocumentationIndexer.index_library` /
  // `.index_language` -- the server embeds + upserts into `docs_vectors`
  // and best-effort extracts a knowledge-graph enrichment alongside the
  // vector write.
  rpc Index(IndexRequest) returns (IndexResponse);

  // Hybrid GraphRAG retrieval: scoped vector top-k + flag-gated graph
  // expansion, assembled into one bounded context string. Mirrors
  // `retrieval.graphrag.retrieve` / its `RetrievalResult`.
  rpc Query(QueryRequest) returns (QueryResponse);

  // Write one scope-stamped memory. Mirrors
  // `tools.memory.ScopedMemoryManager.add`.
  rpc MemoryAdd(MemoryAddRequest) returns (MemoryAddResponse);

  // Search memories within the caller's scope. Mirrors
  // `tools.memory.ScopedMemoryManager.search`.
  rpc MemorySearch(MemorySearchRequest) returns (MemorySearchResponse);

  // (Re)build the code graph for a source tree. Mirrors
  // `graphs.code.index_code`.
  rpc IndexCode(IndexCodeRequest) returns (IndexCodeResponse);

  // Report the caller-scoped code graph's current availability/size.
  rpc CodeGraphStatus(CodeGraphStatusRequest) returns (CodeGraphStatusResponse);

  // Report the caller-scoped docs index's current status (what's indexed,
  // chunk counts, freshness). Mirrors
  // `docs_rag.indexer.DocumentationIndexer.get_index_status`.
  rpc IndexStatus(IndexStatusRequest) returns (IndexStatusResponse);

  // Clear one library's or one language's indexed docs, scoped to the
  // caller. Mirrors `docs_rag.indexer.DocumentationIndexer
  // .clear_library_index`/`.clear_language_index`.
  rpc ClearIndex(ClearIndexRequest) returns (ClearIndexResponse);

  // Remove indexed docs no longer referenced by the caller's current
  // project. Mirrors `docs_rag.indexer.DocumentationIndexer.cleanup_unused`.
  rpc CleanupIndex(CleanupIndexRequest) returns (CleanupIndexResponse);

  // List the caller's own async index jobs (tenant + owner scoped), most
  // recent first. Mirrors `indexing.store.IndexJobStore.list_jobs`.
  rpc ListIndexJobs(ListIndexJobsRequest) returns (ListIndexJobsResponse);
}

// ---- Index ----

// A library-indexing target -- mirrors `docs_rag.models.Library` (name +
// language are required; `version` empty means "latest", matching the
// dataclass's `None` default).
message LibraryTarget {
  string name = 1;
  Language language = 2;
  string version = 3;
}

message IndexRequest {
  string api_version = 1;

  // Exactly one of a library target or a bare language target -- mirrors
  // the two distinct indexer entry points (`index_library`/`index_language`);
  // `doc_contents` below are the explicit document strings indexed under
  // whichever target is set.
  oneof target {
    LibraryTarget library = 2;
    Language language = 3;
  }

  repeated string doc_contents = 4;
  bool force_reindex = 5;
  Visibility visibility = 6;
  string team_id = 7;
}

message IndexResponse {
  // Final chunk count once the job is SUCCEEDED -- 0 while QUEUED/RUNNING,
  // or the real inline count when the job-queue kill switch
  // (`penguincode.disable-index-queue`) is on (see `job_id`'s comment).
  int32 chunks_indexed = 1;

  // Empty when `Index` ran inline (the queue is degraded/disabled) --
  // `state` is then always JOB_STATE_SUCCEEDED and `chunks_indexed` is the
  // real final count already. Non-empty means the work was enqueued;
  // poll `IndexStatus(job_id=...)` for progress/completion.
  string job_id = 2;
  JobState state = 3;
}

// ---- Query ----

message QueryRequest {
  string api_version = 1;
  string query = 2;
  int32 n_vector = 3;
  int32 graph_depth = 4;
  // Vector tables to search -- e.g. "docs_vectors", "memory_vectors"
  // (stores/vector.py's `TableName` allow-list).
  repeated string vector_tables = 5;
}

message QueryResponse {
  repeated VectorHit vector_hits = 1;
  // Keyed by graph kind ("code" / "knowledge" / "memory") -- a kind absent
  // from this map means its flag was off for this call, mirroring
  // `RetrievalResult.subgraphs`' "absent, not empty" contract.
  map<string, Subgraph> subgraphs = 2;
  string context = 3;
}

// ---- MemoryAdd ----

message MemoryAddRequest {
  string api_version = 1;
  string content = 2;
  Visibility visibility = 3;
  string team_id = 4;
  google.protobuf.Struct metadata = 5;
}

// One mem0 write result -- mirrors mem0's raw
// `{"results": [{"id", "memory", "event"}]}` envelope entry.
message MemoryAddResult {
  string id = 1;
  string memory = 2;
  string event = 3;
}

message MemoryAddResponse {
  // False when memory is disabled or the caller's RAG flag is off --
  // mirrors `ScopedMemoryManager.add` returning `None`.
  bool stored = 1;
  repeated MemoryAddResult results = 2;
}

// ---- MemorySearch ----

message MemorySearchRequest {
  string api_version = 1;
  string query = 2;
  int32 limit = 3;
}

// One scope-visible memory row -- mirrors the dicts returned by
// `ScopedMemoryManager.search` (mem0's row shape, already scope-filtered).
message MemoryItem {
  string id = 1;
  string memory = 2;
  google.protobuf.Struct metadata = 3;
  double score = 4;
}

message MemorySearchResponse {
  repeated MemoryItem results = 1;
}

// ---- IndexCode ----

message IndexCodeRequest {
  string api_version = 1;
  string root_path = 2;
  Visibility visibility = 3;
  string team_id = 4;
}

message IndexCodeResponse {
  // False when the `penguincode.code-graph` flag is off for the caller --
  // mirrors `graphs.code.index_code` returning `None`. Always `false` while
  // a queued job hasn't finished yet -- poll `IndexStatus(job_id=...)`.
  bool indexed = 1;
  int32 node_count = 2;
  int32 edge_count = 3;

  // See `IndexResponse.job_id`'s comment -- identical empty/queued contract.
  string job_id = 4;
  JobState state = 5;
}

// ---- CodeGraphStatus ----

message CodeGraphStatusRequest {
  string api_version = 1;
}

message CodeGraphStatusResponse {
  bool enabled = 1;
  int32 node_count = 2;
  int32 edge_count = 3;
}

// ---- IndexStatus ----

// Per-library index status -- mirrors one entry of
// `DocumentationIndexer.get_index_status`'s "libraries" dict.
message LibraryIndexStatus {
  int32 chunk_count = 1;
  string indexed_at = 2;
  string expires_at = 3;
  bool is_expired = 4;
  string language = 5;
}

// Per-language index status -- mirrors one entry of
// `DocumentationIndexer.get_index_status`'s "languages" dict.
message LanguageIndexStatus {
  int32 chunk_count = 1;
  string indexed_at = 2;
  string expires_at = 3;
  bool is_expired = 4;
}

message IndexStatusRequest {
  string api_version = 1;

  // When set, report that one async job's state/progress instead of the
  // aggregate docs-index stats below (see `IndexStatusResponse`'s comment).
  string job_id = 2;
}

message IndexStatusResponse {
  // Populated only when `IndexStatusRequest.job_id` was empty (the
  // aggregate-stats mode, unchanged since before O10-a).
  map<string, LibraryIndexStatus> libraries = 1;
  map<string, LanguageIndexStatus> languages = 2;
  int32 total_chunks = 3;

  // Populated only when `IndexStatusRequest.job_id` was set -- one async
  // job's current state/progress, scoped to the caller (tenant + owner;
  // see `indexing.store.IndexJobStore.get`). `libraries`/`languages`/
  // `total_chunks` above are left empty/zero in this mode.
  string job_id = 4;
  JobType job_type = 5;
  JobState state = 6;
  int32 chunks_done = 7;
  int32 chunks_total = 8;
  string error = 9;
  string created_at = 10;
  string updated_at = 11;
  // Job-type-specific extra detail not covered by the counters above --
  // e.g. an `index_code` job's `node_count`/`edge_count`. Mirrors
  // `indexing.store.IndexJobOutcome.extra` verbatim.
  google.protobuf.Struct result = 12;
}

// ---- ListIndexJobs ----

message ListIndexJobsRequest {
  string api_version = 1;
  // Most-recent-first cap -- defaults to 20 when unset/0.
  int32 limit = 2;
}

// One row of `ListIndexJobsResponse` -- the same per-job fields
// `IndexStatusResponse`'s job-status mode carries.
message IndexJobSummary {
  string job_id = 1;
  JobType job_type = 2;
  JobState state = 3;
  int32 chunks_done = 4;
  int32 chunks_total = 5;
  string error = 6;
  string created_at = 7;
  string updated_at = 8;
  google.protobuf.Struct result = 9;
}

message ListIndexJobsResponse {
  repeated IndexJobSummary jobs = 1;
}

// ---- ClearIndex ----

message ClearIndexRequest {
  string api_version = 1;

  // Exactly one of a library name or a bare language -- mirrors the
  // indexer's two distinct entry points (`clear_library_index` takes a
  // plain name string; `clear_language_index` takes a `Language`).
  oneof target {
    string library_name = 2;
    Language language = 3;
  }
}

message ClearIndexResponse {
  int32 chunks_removed = 1;
}

// ---- CleanupIndex ----

message CleanupIndexRequest {
  string api_version = 1;

  // The caller's current project state -- mirrors `cleanup_unused`'s
  // `current_libraries`/`current_languages` params verbatim. The server has
  // no independent way to know what a given project still references
  // (project detection is a client-side file-tree scan, see
  // `docs_rag.detector.ProjectDetector`), so the CLI supplies its own
  // already-detected state here, the same way `Index`'s `target` is always
  // caller-supplied.
  repeated LibraryTarget current_libraries = 2;
  repeated Language current_languages = 3;
}

message CleanupIndexResponse {
  // Keyed by library/language name, mirrors `cleanup_unused`'s
  // `{name: chunks_removed}` return shape verbatim (a language key carries
  // the "_lang_" prefix `cleanup_unused` itself already applies).
  map<string, int32> removed = 1;
}
