# Gitleaks configuration for penguincode's own `make test-security` gate --
# SCOPE ONLY, mirrors the root `.gitleaks.toml`'s philosophy (see that file's
# header for the full rationale and the canary-verification recipe, which
# applies here unchanged with `--source services/penguincode`).
#
# Only `tests/` is excluded here, the same first-party-source boundary
# `bandit` already draws in this package's own Makefile (`-x ./tests,...`)
# and `Dockerfile.server` (`COPY penguincode_cli/ ./penguincode_cli/` --
# tests are never shipped). The 9 pre-existing findings this allowlist
# covers are all test fixtures for auth/redaction/scrubbing code that must
# contain credential-shaped strings to exercise what they test (e.g.
# tests/test_lessons_scrub.py asserting a fake AWS key gets redacted) --
# identical rationale to the root config's own test-fixture exclusions.
#
# Removing a path from this list is fine. Adding a fingerprint allowlist is
# not -- a new real secret anywhere under `penguincode_cli/`, `scripts/`,
# `client/`, or any other shipped path must still fail this gate.

[extend]
useDefault = true

[allowlist]
description = "Test fixtures only -- never shipped (Dockerfile.server COPYs penguincode_cli/ only)"
paths = [
  '''^tests/''',
  '''^\.venv/''',
  '''(^|/)__pycache__/''',
  '''\.pyc$''',
]

[[rules]]
id = "generic-api-key"
description = "generic-api-key, with the None-assignment false positive excluded"
regex = '''(?i)(?:key|api|token|secret|client|passwd|password|auth|access)(?:[0-9a-z\-_\t .]{0,20})(?:[\s|']|[\s|"]){0,3}(?:=|>|:{1,3}=|\|\|:|<=|=>|:|\?=)(?:'|\"|\s|=|\x60){0,5}([0-9a-z\-_.=]{10,150})(?:['|\"|\n|\r|\s|\x60|;]|$)'''
keywords = ["key", "api", "token", "secret", "client", "passwd", "password", "auth", "access"]
[rules.allowlist]
regexes = ['''^None$''']
