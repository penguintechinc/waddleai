[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "penguincode"
version = "0.1.0"
description = "Penguin Code CLI - AI-powered coding assistant using Ollama"
readme = "README.md"
license = "AGPL-3.0"
requires-python = ">=3.13"
authors = [
    { name = "Penguin Tech Inc", email = "dev@penguintech.io" }
]
keywords = ["cli", "ollama", "ai", "coding", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    # CLI & UI
    # typer 0.27.2 folded the old [all] extra's contents (rich, shellingham)
    # into its base install - the extra no longer exists, so it is dropped.
    "typer==0.27.2",
    "rich==15.0.0",
    "prompt_toolkit==3.0.53",  # Enhanced input with arrow keys, history

    # Async & HTTP
    "httpx==0.28.1",
    "aiohttp==3.14.3",
    "aiofiles==25.1.0",
    "aiosqlite==0.22.1",  # Async SQLite for config store

    # Configuration
    "pyyaml==6.0.3",
    "markdown-it-py==4.2.0",

    # Search & Tools
    "ddgs==9.16.0",
    "pathspec==1.1.1",
    "beautifulsoup4==4.15.0",

    # Memory Layer (mem0)
    "ollama==0.6.2",  # Required by mem0 OllamaEmbedding
    "mem0ai==2.2.0",
    # chromadb has 4 open CVEs with no patched release as of 2026-09-23
    # (GHSA-f4j7-r4q5-qw2c/CVE-2026-45829 critical pre-auth RCE,
    # GHSA-36p7-vc44-83pf/CVE-2026-45833 critical, GHSA-2wm9-hf6c-p5cr and
    # GHSA-xph7-9rjv-w5fr high) - every release from 0.4.17 through the
    # current latest (1.5.9) is affected. All four are exploitable only
    # through chromadb's own HTTP server (/api/v2/tenants/.../collections
    # REST API, multi-tenant RBAC). This service never starts that server or
    # uses HttpClient/trust_remote_code - it only ever calls the embedded,
    # in-process chromadb.PersistentClient (see
    # penguincode_cli/docs_rag/indexer.py and the mem0 "chroma" provider in
    # penguincode_cli/tools/memory.py), so the vulnerable network surface is
    # never reachable. Pinned to the latest release pending an upstream fix;
    # re-evaluate on every dependency bump.
    "chromadb==1.5.9",
    "qdrant-client==1.19.1",
    "psycopg2-binary==2.9.13",
    # psycopg v3 (preferred per CLAUDE.md standards) -- used by db/migrate.py
    # for the pgvector schema migration runner; psycopg2-binary above remains
    # for the existing chromadb/mem0 code paths until T9 removes chromadb.
    "psycopg[binary]==3.3.6",

    # Server Mode (Flask/Quart per CLAUDE.md standards)
    "quart==0.23.1",  # Async Flask-compatible framework
    "flask-security-too==5.8.2",  # Auth, RBAC, sessions (mandatory)
    "hypercorn==0.18.0",  # ASGI server for Quart
    "websockets==17.1",
    "pyjwt==2.15.0",

    # gRPC (Client-Server Mode)
    # Held at the 1.69.x/5.29.x line to match the runtime version validated
    # by the checked-in generated code (penguincode_pb2.py requires protobuf
    # >=5.29.0,<6); bump together with regenerating the proto stubs.
    "grpcio==1.69.0",
    "grpcio-tools==1.69.0",
    "protobuf==5.29.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.8",
    "mypy==2.3.1",
]

[project.scripts]
penguincode = "penguincode_cli.main:app"

[project.urls]
Homepage = "https://github.com/penguintechinc/penguin-code"
Documentation = "https://github.com/penguintechinc/penguin-code#readme"
Repository = "https://github.com/penguintechinc/penguin-code"
Issues = "https://github.com/penguintechinc/penguin-code/issues"

[tool.hatch.build.targets.wheel]
packages = ["penguincode_cli"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # line-too-long (already ignored)
    "N802",   # invalid-function-name (unittest/pytest camelCase methods)
    "N806",   # non-lowercase-variable (Mock* variables in tests)
    "SIM105", # suppressible-exception (try/except pass is often clearer)
    "SIM117", # multiple-with-statements (nested with is sometimes clearer)
]

[tool.ruff.lint.per-file-ignores]
"penguincode_cli/agents/base.py" = ["E402"]  # Late import after tool setup

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
