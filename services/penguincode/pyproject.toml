[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "penguincode"
version = "0.1.0"
description = "Penguin Code CLI - AI-powered coding assistant using Ollama"
readme = "README.md"
license = "AGPL-3.0"
requires-python = ">=3.13"
authors = [
    { name = "Penguin Tech Inc", email = "dev@penguintech.io" }
]
keywords = ["cli", "ollama", "ai", "coding", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    # CLI & UI
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",  # Enhanced input with arrow keys, history

    # Async & HTTP
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "aiofiles>=24.0.0",
    "aiosqlite>=0.20.0",  # Async SQLite for config store

    # Configuration
    "pyyaml>=6.0",
    "markdown-it-py>=3.0.0",

    # Search & Tools
    "ddgs>=8.0.0",
    "pathspec>=0.12.0",
    "beautifulsoup4>=4.12.0",

    # Memory Layer (mem0)
    "ollama>=0.4.0",  # Required by mem0 OllamaEmbedding
    "mem0ai>=0.1.0",
    "chromadb>=0.4.0",
    "qdrant-client>=1.7.0",
    "psycopg2-binary>=2.9.0",

    # Server Mode (Flask/Quart per CLAUDE.md standards)
    "quart>=0.19.0",  # Async Flask-compatible framework
    "flask-security-too>=5.5.0",  # Auth, RBAC, sessions (mandatory)
    "hypercorn>=0.17.0",  # ASGI server for Quart
    "websockets>=14.0",
    "pyjwt>=2.9.0",

    # gRPC (Client-Server Mode)
    "grpcio>=1.60.0,<1.70.0",
    "grpcio-tools>=1.60.0,<1.70.0",
    "protobuf>=5.29.0,<6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.scripts]
penguincode = "penguincode_cli.main:app"

[project.urls]
Homepage = "https://github.com/penguintechinc/penguin-code"
Documentation = "https://github.com/penguintechinc/penguin-code#readme"
Repository = "https://github.com/penguintechinc/penguin-code"
Issues = "https://github.com/penguintechinc/penguin-code/issues"

[tool.hatch.build.targets.wheel]
packages = ["penguincode_cli"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # line-too-long (already ignored)
    "N802",   # invalid-function-name (unittest/pytest camelCase methods)
    "N806",   # non-lowercase-variable (Mock* variables in tests)
    "SIM105", # suppressible-exception (try/except pass is often clearer)
    "SIM117", # multiple-with-statements (nested with is sometimes clearer)
]

[tool.ruff.lint.per-file-ignores]
"penguincode_cli/agents/base.py" = ["E402"]  # Late import after tool setup

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
