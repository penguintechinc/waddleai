[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "penguincode"
version = "0.1.0"
description = "Penguin Code CLI - AI-powered coding assistant using Ollama"
readme = "README.md"
license = "AGPL-3.0"
requires-python = ">=3.13"
authors = [
    { name = "Penguin Tech Inc", email = "dev@penguintech.io" }
]
keywords = ["cli", "ollama", "ai", "coding", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    # CLI & UI
    # typer 0.27.2 folded the old [all] extra's contents (rich, shellingham)
    # into its base install - the extra no longer exists, so it is dropped.
    "typer==0.27.2",
    "rich==15.0.0",
    "prompt_toolkit==3.0.53",  # Enhanced input with arrow keys, history

    # Async & HTTP
    "httpx==0.28.1",
    "aiohttp==3.14.3",
    "aiofiles==25.1.0",
    "aiosqlite==0.22.1",  # Async SQLite for config store

    # Configuration
    "pyyaml==6.0.3",
    "markdown-it-py==4.2.0",

    # Feature Flags (PostHog CE) - penguincode_cli/flags/client.py; pinned
    # explicitly rather than left as mem0ai's floating transitive pin.
    "posthog==7.60.1",

    # Search & Tools
    "ddgs==9.16.0",
    "pathspec==1.1.1",
    "beautifulsoup4==4.15.0",

    # Memory Layer (mem0)
    "ollama==0.6.2",  # Required by mem0 OllamaEmbedding
    "mem0ai==2.2.0",
    # The Chroma vector-store package was removed (T9, 2026-09-25): it
    # carried 4 open CVEs (GHSA-f4j7-r4q5-qw2c/CVE-2026-45829,
    # GHSA-36p7-vc44-83pf/CVE-2026-45833, GHSA-2wm9-hf6c-p5cr,
    # GHSA-xph7-9rjv-w5fr) with no patched release. The docs-RAG indexer (T7)
    # and mem0 memory store (T8) were migrated off it to pgvector/qdrant
    # first, so it was an unused dependency by the time it was dropped.
    "qdrant-client==1.19.1",
    # psycopg v3 (preferred per CLAUDE.md standards) -- used by db/migrate.py
    # for the pgvector schema migration runner and by mem0ai's pgvector
    # store (penguincode_cli/stores/vector.py, stores/graph.py). psycopg2
    # is never imported directly by this codebase; psycopg2-binary was only
    # kept as mem0ai's pgvector fallback for the old Chroma-backed mem0 code
    # path and is dropped alongside that package (T9).
    "psycopg[binary]==3.3.6",
    # mem0ai's pgvector store (mem0/vector_stores/pgvector.py) imports
    # psycopg_pool.ConnectionPool directly; without it, its psycopg3 branch
    # ImportErrors and it falls back to psycopg2 (removed above, T9). Added
    # as an explicit direct dep so the psycopg3-only path fully resolves.
    "psycopg-pool==3.3.3",

    # Server Mode (Flask/Quart per CLAUDE.md standards)
    "quart==0.23.1",  # Async Flask-compatible framework
    "flask-security-too==5.8.2",  # Auth, RBAC, sessions (mandatory)
    "hypercorn==0.18.0",  # ASGI server for Quart
    "websockets==17.1",
    "pyjwt[crypto]==2.15.0",  # [crypto] pulls cryptography, required for RS256 verification (auth/middleware.py, WaddleAI-issued JWTs)

    # gRPC (Client-Server Mode)
    # Held at the 1.69.x/5.29.x line to match the runtime version validated
    # by the checked-in generated code (penguincode_pb2.py requires protobuf
    # >=5.29.0,<6); bump together with regenerating the proto stubs.
    "grpcio==1.69.0",
    "grpcio-tools==1.69.0",
    "protobuf==5.29.6",

    # Observability (OTel) - pinned to the same 1.44.0 line as the root
    # repo's requirements.in so both trees resolve one consistent OTel SDK
    # version. Declared directly (not left as a transitive of the now-removed
    # Chroma vector-store package, T9) so
    # `penguincode_cli/observability/otel.py` keeps a resolvable pin.
    "opentelemetry-api==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.44.0",

    # Code graph (T11) - penguincode_cli/graphs/code.py. Not a prior dependency
    # despite the platform plan's Tech Stack line claiming otherwise (verified
    # 2026-09-25: no tree_sitter import anywhere in penguincode_cli/). Both
    # packages are MIT-licensed (verified via PyPI classifiers), matching the
    # Global Constraints' permissive-license-only rule. tree-sitter-python is
    # the only grammar shipped today; see graphs/code.py's Extensibility note.
    "tree-sitter==0.26.0",
    "tree-sitter-python==0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.8",
    "mypy==2.3.1",
]

[project.scripts]
penguincode = "penguincode_cli.main:app"

[project.urls]
Homepage = "https://github.com/penguintechinc/penguin-code"
Documentation = "https://github.com/penguintechinc/penguin-code#readme"
Repository = "https://github.com/penguintechinc/penguin-code"
Issues = "https://github.com/penguintechinc/penguin-code/issues"

[tool.hatch.build.targets.wheel]
packages = ["penguincode_cli"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # line-too-long (already ignored)
    "N802",   # invalid-function-name (unittest/pytest camelCase methods)
    "N806",   # non-lowercase-variable (Mock* variables in tests)
    "SIM105", # suppressible-exception (try/except pass is often clearer)
    "SIM117", # multiple-with-statements (nested with is sometimes clearer)
]

[tool.ruff.lint.per-file-ignores]
"penguincode_cli/agents/base.py" = ["E402"]  # Late import after tool setup

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
