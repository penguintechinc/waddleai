apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: waddleai
commonLabels:
  environment: beta
resources:
  - ../../base
replicas:
  - name: management
    count: 2
images:
  - name: waddleai/management
    newName: ghcr.io/penguintechinc/waddleai/management
    newTag: beta-1775889793
  - name: waddleai/webui
    newName: ghcr.io/penguintechinc/waddleai/webui
    newTag: beta-1775889794
configMapGenerator:
  - name: waddleai-config
    behavior: merge
    literals:
      - LOG_LEVEL=INFO
      - RELEASE_MODE=false
