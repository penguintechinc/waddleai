apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: waddleai-beta
namePrefix: beta-
commonLabels:
  environment: beta
resources:
  - ../../base
replicas:
  - name: management
    count: 2
images:
  - name: registry-dal2.penguintech.io/waddleai/management
    newTag: latest
configMapGenerator:
  - name: waddleai-config
    behavior: merge
    literals:
      - LOG_LEVEL=INFO
      - RELEASE_MODE=false
