# Default values for WaddleAI Helm Chart
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Global settings
global:
  imageRegistry: registry-dal2.penguintech.io
  imagePullPolicy: IfNotPresent
  storageClass: ""

# Environment name (alpha, beta, prod)
environment: alpha

# Namespace configuration
namespace: waddleai

# Image pull secrets (if needed for private registry)
imagePullSecrets: []

# Management Service
management:
  enabled: true
  replicaCount: 1
  image:
    repository: waddleai/management
    tag: latest
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8001
    targetPort: 8001

  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  livenessProbe:
    enabled: true
    httpGet:
      path: /healthz
      port: 8001
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3

  readinessProbe:
    enabled: true
    httpGet:
      path: /healthz
      port: 8001
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  env:
    DB_TYPE: postgres
    FLASK_ENV: production
    ENABLE_OLLAMA_MANAGEMENT: "true"
    ENABLE_USAGE_WEBHOOKS: "true"
    ENABLE_GEMINI: "true"
    ENABLE_BEDROCK: "true"
    ENABLE_AZURE_OPENAI: "true"
    ENABLE_COHERE: "true"
    OLLAMA_MANAGEMENT_MODE: both
    LOG_LEVEL: INFO

  # Secret env vars (from k8s secrets)
  secretEnv:
    - name: DATABASE_URL
      secretName: waddleai-secrets
      key: database-url
    - name: JWT_SECRET
      secretName: waddleai-secrets
      key: jwt-secret
    - name: FLASK_SECRET_KEY
      secretName: waddleai-secrets
      key: flask-secret-key
    - name: WEBHOOK_SECRET
      secretName: waddleai-secrets
      key: webhook-secret
    - name: POSTGRES_PASSWORD
      secretName: waddleai-secrets
      key: postgres-password

# WebUI Service
webui:
  enabled: true
  replicaCount: 1
  image:
    repository: waddleai/webui
    tag: latest
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080

  resources:
    requests:
      memory: "64Mi"
      cpu: "100m"
    limits:
      memory: "128Mi"
      cpu: "200m"

  livenessProbe:
    enabled: true
    httpGet:
      path: /
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    enabled: true
    httpGet:
      path: /
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

# PostgreSQL Database
postgres:
  enabled: true
  replicaCount: 1
  image:
    repository: postgres
    tag: "15"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 5432
    targetPort: 5432

  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""

  env:
    POSTGRES_DB: waddleai
    POSTGRES_USER: waddleai

  secretEnv:
    - name: POSTGRES_PASSWORD
      secretName: waddleai-secrets
      key: postgres-password

  livenessProbe:
    enabled: true
    exec:
      command:
        - /bin/sh
        - -c
        - pg_isready -U waddleai -d waddleai
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    enabled: true
    exec:
      command:
        - /bin/sh
        - -c
        - pg_isready -U waddleai -d waddleai
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# Redis Cache
redis:
  enabled: true
  replicaCount: 1
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 6379
    targetPort: 6379

  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""

  args:
    - redis-server
    - --appendonly
    - "yes"

  livenessProbe:
    enabled: true
    exec:
      command:
        - redis-cli
        - ping
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    enabled: true
    exec:
      command:
        - redis-cli
        - ping
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# Ingress configuration
ingress:
  enabled: false
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  hosts:
    - host: waddleai.penguintech.io
      paths:
        - path: /
          pathType: Prefix
          serviceName: waddleai-webui
          servicePort: 8080
        - path: /api
          pathType: Prefix
          serviceName: waddleai-management
          servicePort: 8001
  tls:
    - secretName: waddleai-tls
      hosts:
        - waddleai.penguintech.io

# Service Account
serviceAccount:
  create: true
  annotations: {}
  name: waddleai

# Pod Security Context
podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  runAsUser: 1000

# Security Context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Pod Disruption Budget
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Network Policy
networkPolicy:
  enabled: false
  policyTypes:
    - Ingress
    - Egress
