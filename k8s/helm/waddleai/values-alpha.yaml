# Alpha Environment Values
# Development/Testing environment with minimal resources

environment: alpha

# Alpha images are built by CI (.github/workflows/alpha-build.yml, runner
# dal2-alpha) and pushed to ghcr.io/penguintechinc/waddleai/<svc> (packages are
# public -> no imagePullSecret needed; if they go private, set imagePullSecrets
# to a ghcr dockerconfigjson secret). The service repositories below carry the
# org prefix because the chart renders <imageRegistry>/<repository>:<tag>.
# Tags: CI pushes immutable alpha-<epoch64> plus a floating alpha-latest. The
# tag defaults to alpha-latest here; ArgoCD pins a build by overriding
# {management,proxy,webui,classification}.image.tag (helm parameters or Image
# Updater) with the alpha-<epoch64> from the workflow run summary.
global:
  imageRegistry: ghcr.io

# Management Service - Alpha
management:
  replicaCount: 1
  image:
    repository: penguintechinc/waddleai/management
    tag: alpha-latest
    pullPolicy: Always

  # Presidio loads spaCy en_core_web_lg in each of the 2 hypercorn workers
  # (~2.x Gi total) -- OOMKilled at 256Mi and 1Gi, Ready only at 3Gi.
  resources:
    requests:
      memory: "2Gi"
      cpu: "100m"
    limits:
      memory: "3Gi"
      cpu: "500m"

  env:
    LOG_LEVEL: DEBUG
    FLASK_ENV: development

  # Local K8s (MicroK8s/Docker Desktop) typically has no metrics-server --
  # a single-node dev cluster has no scaling upside anyway. Off here, on by
  # default from values.yaml for beta/prod.
  autoscaling:
    enabled: false

# AIProxy Service - Alpha
proxy:
  # Core data plane -- always deployed in a representative alpha release test.
  enabled: true
  replicaCount: 1
  image:
    repository: penguintechinc/waddleai/proxy
    tag: alpha-latest
    pullPolicy: Always

  # 1 hypercorn worker (base default 2): each worker loads spaCy en_core_web_lg
  # (~1.3-1.5Gi); proxy was OOMKilled at 256Mi with 4 workers.
  workers: 1
  resources:
    requests:
      memory: "1536Mi"
      cpu: "100m"
    limits:
      memory: "3Gi"
      cpu: "250m"

  env:
    LOG_LEVEL: DEBUG

  autoscaling:
    enabled: false

# WebUI Service - Alpha
webui:
  replicaCount: 1
  image:
    repository: penguintechinc/waddleai/webui
    tag: alpha-latest
    pullPolicy: Always

  resources:
    requests:
      memory: "32Mi"
      cpu: "50m"
    limits:
      memory: "64Mi"
      cpu: "100m"

  autoscaling:
    enabled: false

# PostgreSQL - Alpha
postgres:
  replicaCount: 1

  # Upstream pgvector/pgvector:pg17, digest-pinned (same digest as
  # rust-proxy-build.yml's CI service container).
  image:
    repository: pgvector/pgvector
    tag: pg17
    digest: "sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d"
    pullPolicy: IfNotPresent

  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  persistence:
    enabled: true
    size: 5Gi

# Valkey - Alpha
valkey:
  replicaCount: 1

  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"

  persistence:
    enabled: true
    size: 2Gi

# Ingress - Enabled for Alpha
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  hosts:
    - host: waddleai.localhost.local
      paths:
        - path: /
          pathType: Prefix
          serviceName: waddleai-webui
          servicePort: 8080
        - path: /api
          pathType: Prefix
          serviceName: waddleai-management
          servicePort: 8001
  tls:
    - secretName: waddleai-tls
      hosts:
        - waddleai.localhost.local

# Pod Disruption Budget - Disabled for Alpha
podDisruptionBudget:
  enabled: false

# Cilium integration - Alpha
# Local K8s (MicroK8s/Docker Desktop) frequently has no Cilium CNI installed
# at all. Leave the reconciler + RBAC + bootstrap-CNP toggle ON regardless --
# the `.Capabilities.APIVersions.Has "cilium.io/v2"` guard on the CNP
# template and the reconciler's own cilium_capabilities() check both degrade
# cleanly when the CRDs are absent (§12.3), so this is safe to leave on and
# exercises the same code path alpha would run in beta/prod.
cilium:
  enabled: true
  rbac:
    create: true
  networkPolicy:
    enabled: true
  rateLimit:
    enabled: true
  topology:
    gatewayNamespace: gateway
    # penguincode's global.namespace override for alpha (services/penguincode/
    # k8s/helm/penguincode/values-alpha.yaml).
    penguincodeIngress:
      namespace: penguincode-alpha

# External fleet node auth mode - Alpha (spec §10.3, Q#4, Task 15).
# fleet.external.enabled stays false (opt-in, inherited from values.yaml) —
# this only sets which mode applies *if* an operator turns it on, since
# alpha/dev environments typically lack a private CA for cert-manager
# client-auth issuance. Set fleet.external.enabled=true + populate
# fleet.external.nodes to actually use it.
fleet:
  external:
    mode: token

# Tetragon + admission policies - Alpha
# Dev-friendly: AIProxy/Management exec allowlists relaxed to observe (no
# enforced kills while iterating locally) and admission failurePolicy
# relaxed to Ignore. Local MicroK8s frequently lacks the Tetragon/VAP CRDs
# entirely — the capability guard in each template already no-ops cleanly
# there; these overrides just make the alpha experience non-disruptive on
# clusters that DO have the CRDs.
tetragon:
  exec:
    components:
      proxy:
        mode: observe
      management:
        mode: observe
      classification:
        mode: observe

admissionPolicies:
  failurePolicy: Ignore

# Pod Security Admission - Alpha
# Alpha never enables ollama (no hostPath volume) or the GPU-operator
# subcharts (no node-feature-discovery hostPaths), and this chart's own
# containers are now seccompProfile/drop-ALL-capabilities compliant (see
# values.yaml comment) — `restricted` is fully reachable here. `audit`/
# `warn` were already `restricted`; this raises `enforce` to match.
podSecurityAdmission:
  enforce: restricted

# Classification Service - Alpha
# DEV ONLY: plaintext gRPC (ALLOW_INSECURE_GRPC=1). Local MicroK8s has no private
# CA / cert-manager issuer, and the pod otherwise fail-closes. NEVER copy this to
# beta/gamma/production -- those mount a cert-manager TLS Secret.
classification:
  enabled: true
  jwt:
    host: "waddleai.localhost.local"
  # DEV ONLY: flag override so NER is testable without a live PostHog.
  flagOverridePiiNer: true
  replicaCount: 1
  image:
    repository: penguintechinc/waddleai/classification
    tag: alpha-latest
    pullPolicy: Always
  tls:
    enabled: false
    allowInsecure: true
  autoscaling:
    enabled: false
  # Memory is the measured floor (en_core_web_lg, pool=2); only CPU is trimmed.
  resources:
    requests:
      memory: "1.8Gi"
      cpu: "250m"
    limits:
      memory: "2.2Gi"
      cpu: "1000m"
  env:
    LOG_LEVEL: DEBUG
  otel:
    endpoint: "http://otel-collector.monitoring:4317"
    protocol: "grpc"
