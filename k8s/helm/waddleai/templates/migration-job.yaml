{{/*
Alembic database migration Job — runs `alembic upgrade head` from the
management image, once per release (see Hook ordering below). services/management/app/extensions.py's init_extensions() only
bootstraps default data (idempotent on every pod start); schema changes
only ever land via versioned Alembic migrations
(services/management/alembic/versions/*.py), which per house rule must
never run from application startup code — hence this dedicated Job instead
of a container CMD/entrypoint hack. On a fresh, EMPTY database 001_baseline
creates the frozen pre-Alembic baseline and the real chain (002..head, incl.
seed rows + pgvector DDL) runs on top in one transaction (gh-215), so a first
`helm install` needs no manual create_all; it fails loudly (rolled back) if
pgvector is unavailable.

Hook ordering (post-install,post-upgrade): Postgres is a PLAIN resource and
must stay one -- never a hook: a hook with before-hook-creation would delete
and recreate the database on every `helm upgrade` of gamma/prod (in-place
upgrade, real data). Helm applies plain resources only after all pre-*
hooks finish, so a pre-install migration hook on an EMPTY namespace waited
forever for a Postgres that did not exist yet (DeadlineExceeded). As a
post-* hook this Job runs after Postgres/Valkey/Secret/ServiceAccount exist
and its wait-for-postgres init container succeeds. It stays a hook (not a
plain Job) because a Job spec is immutable -- Helm's delete+recreate via
before-hook-creation is what lets it re-run on every upgrade.

Because the management/proxy Deployments now exist before this Job runs,
and both call create_all on startup (which gh-215's 001_baseline refuses to
migrate over), each runs a wait-for-schema-head initContainer
(_helpers.tpl "waddleai.waitForSchemaHead") that blocks until alembic_version
is at head. This single Job is the only migration runner. A failed Job still
fails the release (hook failure is fatal; Helm 4's default hookOnly wait
covers it) -- do NOT pass a bare `--wait` (see the helper's CAVEAT).

templates/secret.yaml is a pre-install,pre-upgrade hook (weight -20) so
waddleai-secrets (this Job's DATABASE_URL source) exists regardless of hook
phase.

hook-delete-policy is before-hook-creation only (NOT hook-succeeded): the
last run's log must survive for inspection; the next upgrade's
before-hook-creation deletes the stale Job so re-running never hits
"already exists".
*/}}
{{- if .Values.migrations.enabled -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "waddleai.fullname" . }}-migration
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "waddleai.labels" . | nindent 4 }}
    app.kubernetes.io/component: management
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "waddleai.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: management
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "waddleai.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command: ['sh', '-c', 'until nc -z {{ include "waddleai.fullname" . }}-postgres 5432; do echo waiting for postgres; sleep 2; done;']
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
      containers:
        - name: migrate
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "waddleai.management.image" . }}
          imagePullPolicy: {{ .Values.management.image.pullPolicy }}
          workingDir: /app
          # This pod keeps component=management (the Cilium/Tetragon policies and the
          # management-runtime reconciler key on that label, so changing it would cut
          # the Job's Postgres access), which also matches the management Service and
          # PDB selectors. A never-passing readiness probe keeps it OUT of the Service
          # endpoints (no blackholed traffic) for the Job's short life. Probe runs the
          # allowlisted venv python (Tetragon-safe).
          readinessProbe:
            exec:
              command: ["/opt/venv/bin/python3", "-c", "raise SystemExit(1)"]
            periodSeconds: 10
            failureThreshold: 1000
          # /app/alembic.ini has script_location = alembic (relative to
          # cwd), so no -c flag is needed as long as workingDir matches the
          # image's WORKDIR (services/management/Dockerfile). Invoked as
          # "python3 -m alembic" (not the /opt/venv/bin/alembic console
          # script) so the process the Tetragon exec-allowlist observes is
          # /opt/venv/bin/python3 — already allowlisted for the management
          # component (values.yaml tetragon.exec.components.management) —
          # instead of a second, unlisted binary.
          command:
            - /opt/venv/bin/python3
            - -m
            - alembic
            - upgrade
            - head
          env:
            {{- include "waddleai.management.databaseUrlEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
