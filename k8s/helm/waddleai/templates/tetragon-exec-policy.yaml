{{/*
Tetragon exec-guard: an ENFORCED allowlist (hooks security_bprm_check, so execveat cannot bypass it) of each targeted component's own
runtime binaries (spec §12.2; house security mandate — allowlist, not
observe-only). One TracingPolicyNamespaced per component so the allowlist
stays scoped to that pod's actual process inventory (a Python service's
allowed binaries are not ollama's) rather than one policy loose enough to
cover everyone and therefore covering no one.

Guarded by BOTH the values toggle (tetragon.enabled + tetragon.exec.enabled)
AND a live capability check (.Capabilities.APIVersions.Has, or
tetragon.forceRender for offline golden renders), mirroring
cilium-network-policy.yaml's pattern, so non-Tetragon clusters render every
other template in the chart cleanly and simply skip these objects (§12.3)
rather than failing `helm install`.
*/}}
{{- if and .Values.tetragon.enabled .Values.tetragon.exec.enabled (or .Values.tetragon.forceRender (.Capabilities.APIVersions.Has "cilium.io/v1alpha1/TracingPolicyNamespaced")) -}}
{{- range $comp, $cfg := .Values.tetragon.exec.components }}
{{- /* ray-head/ray-worker only exist when the vLLM-on-Ray fleet is enabled: never render their policies otherwise. */}}
{{- if and $cfg.enabled (or (not (hasPrefix "ray-" $comp)) $.Values.fleet.vllmRay.enabled) }}
---
apiVersion: cilium.io/v1alpha1
kind: TracingPolicyNamespaced
metadata:
  name: {{ include "waddleai.fullname" $ }}-exec-allowlist-{{ $comp }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "waddleai.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $comp }}
spec:
  podSelector:
    matchLabels:
      {{- include "waddleai.selectorLabels" $ | nindent 6 }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [{{ $comp | quote }}]
  {{- with $cfg.containers }}
  containerSelector:
    matchExpressions:
      - key: name
        operator: In
        values: {{ toJson . }}
  {{- end }}
  kprobes:
    # security_bprm_check sees the RESOLVED binary of every execve AND execveat/fexecve (and a
    # `#!` interpreter), unlike a sys_execve arg0 match. Allowlist entries are therefore REAL
    # paths (symlinks resolved), e.g. /usr/local/bin/python3.13, not /usr/local/bin/python3.
    - call: "security_bprm_check"
      syscall: false
      args:
        - index: 0
          type: "linux_binprm"
      selectors:
        - matchArgs:
            - index: 0
              operator: "NotEqual"
              values:
                {{- range $cfg.allowedExecs }}
                - {{ . | quote }}
                {{- end }}
                {{- if $cfg.usesPython }}
                - {{ $.Values.tetragon.exec.pythonRealPath | quote }}
                {{- end }}
            {{- with $cfg.allowedPrefixes }}
            - index: 0
              operator: "NotPrefix"
              values:
                {{- range . }}
                - {{ . | quote }}
                {{- end }}
            {{- end }}
          matchActions:
            {{- /* Ray pods follow tetragon.model.ray.mode (observe-first runbook) */}}
            {{- if eq (ternary $.Values.tetragon.model.ray.mode $cfg.mode (hasPrefix "ray-" $comp)) "enforce" }}
            - action: Sigkill
            {{- else }}
            - action: Post
            {{- end }}
{{- end }}
{{- end }}
{{- end }}
