apiVersion: v1
kind: Secret
metadata:
  name: waddleai-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "waddleai.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: "changeme-postgres-password"
  database-url: "postgres://waddleai:changeme-postgres-password@waddleai-postgres:5432/waddleai"
  jwt-secret: "changeme-jwt-secret-min-32-characters-required"
  flask-secret-key: "changeme-flask-secret-key"
  webhook-secret: "changeme-webhook-secret"
---
# Note: In production, use external secret management (e.g., Sealed Secrets, External Secrets Operator)
# or create secrets manually with actual secure values:
#
# kubectl create secret generic waddleai-secrets \
#   --from-literal=postgres-password='<secure-password>' \
#   --from-literal=database-url='postgres://waddleai:<secure-password>@waddleai-postgres:5432/waddleai' \
#   --from-literal=jwt-secret='<secure-jwt-secret>' \
#   --from-literal=flask-secret-key='<secure-flask-key>' \
#   --from-literal=webhook-secret='<secure-webhook-secret>' \
#   --namespace waddleai
