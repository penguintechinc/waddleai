{{- if .Values.secrets.manage }}
apiVersion: v1
kind: Secret
metadata:
  name: waddleai-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "waddleai.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ .Values.secrets.postgresPassword | quote }}
  database-url: {{ printf "postgresql://waddleai:%s@%s-postgres:5432/waddleai" .Values.secrets.postgresPassword (include "waddleai.fullname" .) | quote }}
  jwt-secret: {{ .Values.secrets.jwtSecret | quote }}
  flask-secret-key: {{ .Values.secrets.flaskSecretKey | quote }}
  webhook-secret: {{ .Values.secrets.webhookSecret | quote }}
  fleet-external-token: {{ .Values.secrets.fleetExternalToken | quote }}
{{- end }}
