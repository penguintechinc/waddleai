{{- if .Values.secrets.manage }}
apiVersion: v1
kind: Secret
metadata:
  name: waddleai-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "waddleai.labels" . | nindent 4 }}
  annotations:
    # Made a pre-install,pre-upgrade hook (instead of a plain resource) so
    # it is guaranteed to exist before templates/migration-job.yaml's own
    # pre-install,pre-upgrade hook runs — Helm applies plain (non-hook)
    # resources like a Secret only AFTER all pre-install hooks complete, so
    # without this the migration Job's DATABASE_URL secretKeyRef would
    # dangle on a fresh `helm install`. Weight (-20) sorts well before the
    # migration Job's weight (see migration-job.yaml). No `hook-succeeded`
    # in the delete policy — this Secret must persist for the long-lived
    # Deployments to consume, not be torn down once the hook phase ends.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  postgres-password: {{ .Values.secrets.postgresPassword | quote }}
  database-url: {{ printf "postgresql://waddleai:%s@%s-postgres:5432/waddleai" .Values.secrets.postgresPassword (include "waddleai.fullname" .) | quote }}
  jwt-secret: {{ .Values.secrets.jwtSecret | quote }}
  flask-secret-key: {{ .Values.secrets.flaskSecretKey | quote }}
  webhook-secret: {{ .Values.secrets.webhookSecret | quote }}
  fleet-external-token: {{ .Values.secrets.fleetExternalToken | quote }}
  # See waddleai.proxyGrpcAuthToken (_helpers.tpl) for why this key alone
  # uses lookup-based generate-once-and-keep-stable instead of a static
  # "changeme" placeholder like the keys above.
  proxy-grpc-auth-token: {{ include "waddleai.proxyGrpcAuthToken" . | quote }}
  # Admin bootstrap password (management, ADMIN_INITIAL_PASSWORD). Left
  # empty on purpose, unlike the "changeme-*" placeholders above —
  # services/management/app/extensions.py's init_default_data() already
  # fails closed when this is unset (an unrecoverable random password, no
  # known default credential), so silently generating one here would just
  # replace one un-loggable secret with another. Set explicitly via
  # --set-string secrets.adminInitialPassword=... before first install if
  # you want a known bootstrap password instead.
  admin-initial-password: {{ .Values.secrets.adminInitialPassword | quote }}
  # License key (management + proxy, LICENSE_KEY). Empty by default = the
  # code's own graceful degradation to community tier
  # (shared/licensing/python_client.py logs a warning, not a startup
  # failure, when unset) — never auto-generate a license key.
  license-key: {{ .Values.secrets.licenseKey | quote }}
  # Credential encryption key (management only, CREDENTIAL_ENCRYPTION_KEY).
  # See waddleai.credentialEncryptionKey (_helpers.tpl): generate-once and
  # NEVER rotate — rotating this bricks every already-encrypted provider
  # credential in the database.
  credential-encryption-key: {{ include "waddleai.credentialEncryptionKey" . | quote }}
{{- end }}
