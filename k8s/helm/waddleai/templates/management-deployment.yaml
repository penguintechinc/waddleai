{{- if .Values.management.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "waddleai.fullname" . }}-management
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "waddleai.labels" . | nindent 4 }}
    app.kubernetes.io/component: management
spec:
  replicas: {{ .Values.management.replicaCount }}
  selector:
    matchLabels:
      {{- include "waddleai.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: management
  template:
    metadata:
      labels:
        {{- include "waddleai.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: management
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "waddleai.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command: ['sh', '-c', 'until nc -z {{ include "waddleai.fullname" . }}-postgres 5432; do echo waiting for postgres; sleep 2; done;']
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
        - name: wait-for-valkey
          image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command: ['sh', '-c', 'until nc -z {{ include "waddleai.fullname" . }}-valkey 6379; do echo waiting for valkey; sleep 2; done;']
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
      containers:
        - name: management
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "waddleai.management.image" . }}
          imagePullPolicy: {{ .Values.management.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.management.service.targetPort }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.management.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: CACHE_HOST
              value: "{{ include "waddleai.fullname" . }}-valkey"
            - name: CACHE_PORT
              value: "6379"
            - name: REDIS_URL
              value: "redis://{{ include "waddleai.fullname" . }}-valkey:6379/0"
            {{- with include "waddleai.publicHost" . }}
            - name: WADDLEAI_PUBLIC_HOST
              value: {{ . | quote }}
            {{- end }}
            {{- range .Values.management.secretEnv }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .key }}
            {{- end }}
            {{- if .Values.ollama.enabled }}
            - name: OLLAMA_HOST
              value: "http://{{ include "waddleai.fullname" . }}-ollama:{{ .Values.ollama.service.port }}"
            {{- end }}
            {{- if .Values.cilium.enabled }}
            - name: CILIUM_ENABLED
              value: "true"
            - name: CILIUM_RATELIMIT_ENABLED
              value: {{ .Values.cilium.rateLimit.enabled | quote }}
            - name: CILIUM_TOPOLOGY
              valueFrom:
                configMapKeyRef:
                  name: {{ include "waddleai.fullname" . }}-cilium-topology
                  key: topology.json
            {{- else }}
            - name: CILIUM_ENABLED
              value: "false"
            {{- end }}
          {{- if .Values.management.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.management.livenessProbe.httpGet.path }}
              port: {{ .Values.management.livenessProbe.httpGet.port }}
            initialDelaySeconds: {{ .Values.management.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.management.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.management.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.management.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.management.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.management.readinessProbe.httpGet.path }}
              port: {{ .Values.management.readinessProbe.httpGet.port }}
            initialDelaySeconds: {{ .Values.management.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.management.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.management.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.management.readinessProbe.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.management.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
