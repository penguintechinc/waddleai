{{- if .Values.webui.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "waddleai.fullname" . }}-webui
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "waddleai.labels" . | nindent 4 }}
    app.kubernetes.io/component: webui
spec:
  # Omitted entirely when autoscaling is enabled -- see management-deployment.yaml.
  {{- if not .Values.webui.autoscaling.enabled }}
  replicas: {{ .Values.webui.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "waddleai.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: webui
  template:
    metadata:
      labels:
        {{- include "waddleai.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: webui
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "waddleai.serviceAccountName" . }}
      {{- with .Values.webui.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: webui
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            # trivy KSV-0014. nginx needs exactly three writable paths, all
            # mounted as emptyDir below: /tmp, /var/cache/nginx (client_temp,
            # proxy_temp and friends -- nginx mkdir()s these at startup) and
            # /var/run (nginx.pid). /var/log/nginx is deliberately NOT mounted:
            # the base image symlinks access.log/error.log to /dev/stdout and
            # /dev/stderr, and an emptyDir over it would shadow those symlinks
            # and silently divert container logs into the volume.
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          image: {{ include "waddleai.webui.image" . }}
          imagePullPolicy: {{ .Values.webui.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          {{- /*
          O4-c: liveness and readiness used to be hardcoded to the exact
          same httpGet check, so a readiness-only dependency failure could
          never be distinguished from a dead process -- both always failed
          together. Now wired to webui.livenessProbe (tcpSocket, cheap
          process-alive check) and webui.readinessProbe (httpGet, proves
          nginx is actually serving) in values.yaml, each independently
          enable-able.
          */}}
          {{- if .Values.webui.livenessProbe.enabled }}
          livenessProbe:
            {{- if .Values.webui.livenessProbe.tcpSocket }}
            tcpSocket:
              port: {{ .Values.webui.livenessProbe.tcpSocket.port }}
            {{- else }}
            httpGet:
              path: {{ .Values.webui.livenessProbe.httpGet.path }}
              port: {{ .Values.webui.livenessProbe.httpGet.port }}
            {{- end }}
            initialDelaySeconds: {{ .Values.webui.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.webui.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.webui.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.webui.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.webui.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.webui.readinessProbe.httpGet.path }}
              port: {{ .Values.webui.readinessProbe.httpGet.port }}
            initialDelaySeconds: {{ .Values.webui.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.webui.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.webui.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.webui.readinessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.webui.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.webui.startupProbe.httpGet.path }}
              port: {{ .Values.webui.startupProbe.httpGet.port }}
            initialDelaySeconds: {{ .Values.webui.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.webui.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.webui.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.webui.startupProbe.failureThreshold }}
          {{- end }}
          {{- with .Values.webui.preStopSleepSeconds }}
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep {{ . }}"]
          {{- end }}
          resources:
            {{- toYaml .Values.webui.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
