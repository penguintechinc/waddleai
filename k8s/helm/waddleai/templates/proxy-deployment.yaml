{{- if .Values.proxy.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "waddleai.fullname" . }}-proxy
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "waddleai.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
spec:
  # Omitted entirely when autoscaling is enabled -- see management-deployment.yaml.
  {{- if not .Values.proxy.autoscaling.enabled }}
  replicas: {{ .Values.proxy.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "waddleai.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: proxy
  template:
    metadata:
      labels:
        {{- include "waddleai.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: proxy
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "waddleai.serviceAccountName" . }}
      {{- with .Values.proxy.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command: ['sh', '-c', 'until nc -z {{ include "waddleai.fullname" . }}-postgres 5432; do echo waiting for postgres; sleep 2; done;']
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
        - name: wait-for-valkey
          image: busybox:1.36@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
          command: ['sh', '-c', 'until nc -z {{ include "waddleai.fullname" . }}-valkey 6379; do echo waiting for valkey; sleep 2; done;']
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
      containers:
        - name: proxy
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          image: {{ include "waddleai.proxy.image" . }}
          imagePullPolicy: {{ .Values.proxy.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.proxy.service.targetPort }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.proxy.service.grpcTargetPort }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.proxy.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: CACHE_HOST
              value: "{{ include "waddleai.fullname" . }}-valkey"
            - name: CACHE_PORT
              value: "6379"
            - name: REDIS_URL
              value: "redis://{{ include "waddleai.fullname" . }}-valkey:6379/0"
            - name: MANAGEMENT_SERVER_URL
              value: "http://{{ include "waddleai.fullname" . }}-management:{{ .Values.management.service.port }}"
            # O9: drives proxy/Dockerfile's CMD (`hypercorn ... --workers
            # ${HYPERCORN_WORKERS}`) -- was a hardcoded `--workers 4`.
            - name: HYPERCORN_WORKERS
              value: {{ .Values.proxy.workers | default 4 | quote }}
            # O5-a: Hypercorn's own graceful drain window -- see
            # proxy/Dockerfile's CMD and values.yaml proxy.gracefulTimeoutSeconds.
            - name: HYPERCORN_GRACEFUL_TIMEOUT
              value: {{ .Values.proxy.gracefulTimeoutSeconds | default 30 | quote }}
            # O5-a: grace period for the internal gRPC server's stop() in
            # ProxyServer.shutdown() (proxy/apps/proxy_server/main.py) -- was
            # hardcoded `grace=5`.
            - name: PROXY_GRPC_SHUTDOWN_GRACE_SECONDS
              value: {{ .Values.proxy.grpcShutdownGraceSeconds | default 5 | quote }}
            {{- with include "waddleai.publicHost" . }}
            - name: WADDLEAI_PUBLIC_HOST
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.ollama.enabled }}
            # Canonical Ollama endpoint (config-hygiene ops-audit 2026-10-09;
            # see docs/deployment/CONFIGURATION.md "Ollama endpoints" table
            # and shared/utils/ollama_endpoint.py). OLLAMA_BASE_URL kept
            # alongside, DEPRECATED -- it was this proxy's own prior,
            # undocumented env-var spelling for the same setting.
            - name: WADDLEAI_OLLAMA_URL
              value: "http://{{ include "waddleai.fullname" . }}-ollama:{{ .Values.ollama.service.port }}"
            - name: OLLAMA_BASE_URL
              value: "http://{{ include "waddleai.fullname" . }}-ollama:{{ .Values.ollama.service.port }}"
            {{- end }}
            {{- if .Values.ollamaEmbeddings.enabled }}
            # Ollama-embedding bulkhead (ops-audit O10/O5) -- canonical name;
            # see values.yaml ollamaEmbeddings' own comment for when to
            # enable this block.
            - name: WADDLEAI_OLLAMA_EMBEDDING_URL
              value: "http://{{ include "waddleai.fullname" . }}-ollama-embeddings:{{ .Values.ollamaEmbeddings.service.port }}"
            {{- end }}
            {{- range .Values.proxy.secretEnv }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .key }}
            {{- end }}
            {{- if .Values.fleet.external.enabled }}
            # External/bare-metal fleet node auth (spec §10.3, Task 15). This
            # is the Helm-side contract only — reading these to actually
            # route external-node calls is a shared/fleet backend concern,
            # separately scoped from this task's Dockerfile/Helm wiring.
            - name: FLEET_EXTERNAL_MODE
              value: {{ .Values.fleet.external.mode | quote }}
            {{- if and (eq .Values.fleet.external.mode "mtls") (.Capabilities.APIVersions.Has "cert-manager.io/v1") }}
            - name: FLEET_EXTERNAL_TLS_CERT_PATH
              value: "/etc/waddleai/fleet-external-tls/tls.crt"
            - name: FLEET_EXTERNAL_TLS_KEY_PATH
              value: "/etc/waddleai/fleet-external-tls/tls.key"
            - name: FLEET_EXTERNAL_TLS_CA_PATH
              value: "/etc/waddleai/fleet-external-tls/ca.crt"
            {{- else if eq .Values.fleet.external.mode "token" }}
            - name: FLEET_EXTERNAL_PROXY_URL
              value: "http://127.0.0.1:{{ .Values.fleet.external.token.sidecarPort }}"
            {{- end }}
            {{- end }}
          {{- if .Values.proxy.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.proxy.livenessProbe.httpGet.path }}
              port: {{ .Values.proxy.livenessProbe.httpGet.port }}
            initialDelaySeconds: {{ .Values.proxy.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.proxy.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.proxy.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.proxy.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.proxy.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.proxy.readinessProbe.httpGet.path }}
              port: {{ .Values.proxy.readinessProbe.httpGet.port }}
            initialDelaySeconds: {{ .Values.proxy.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.proxy.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.proxy.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.proxy.readinessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.proxy.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.proxy.startupProbe.httpGet.path }}
              port: {{ .Values.proxy.startupProbe.httpGet.port }}
            initialDelaySeconds: {{ .Values.proxy.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.proxy.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.proxy.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.proxy.startupProbe.failureThreshold }}
          {{- end }}
          {{- with .Values.proxy.preStopSleepSeconds }}
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep {{ . }}"]
          {{- end }}
          resources:
            {{- toYaml .Values.proxy.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if and .Values.fleet.external.enabled (eq .Values.fleet.external.mode "mtls") (.Capabilities.APIVersions.Has "cert-manager.io/v1") }}
            - name: fleet-external-tls
              mountPath: /etc/waddleai/fleet-external-tls
              readOnly: true
            {{- end }}
        {{- if and .Values.fleet.external.enabled (eq .Values.fleet.external.mode "token") }}
        # Shared-token sidecar (alpha/dev — spec §10.3, Q#4): injects
        # Authorization: Bearer <token> on the way to each configured
        # external fleet node. The proxy container talks to it over
        # loopback via FLEET_EXTERNAL_PROXY_URL above; it never sees the
        # token itself.
        - name: fleet-external-token-proxy
          image: {{ if .Values.fleet.external.token.image.digest }}{{ .Values.fleet.external.token.image.repository }}@{{ .Values.fleet.external.token.image.digest }}{{ else }}{{ .Values.fleet.external.token.image.repository }}:{{ .Values.fleet.external.token.image.tag }}{{ end }}
          imagePullPolicy: {{ .Values.fleet.external.token.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          ports:
            - name: fleet-token
              containerPort: {{ .Values.fleet.external.token.sidecarPort }}
              protocol: TCP
          env:
            - name: FLEET_EXTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: waddleai-secrets
                  key: fleet-external-token
          volumeMounts:
            - name: fleet-external-token-template
              mountPath: /etc/nginx/templates
              readOnly: true
            - name: fleet-external-nginx-confd
              mountPath: /etc/nginx/conf.d
            - name: fleet-external-nginx-cache
              mountPath: /var/cache/nginx
            - name: fleet-external-nginx-run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
        {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if and .Values.fleet.external.enabled (eq .Values.fleet.external.mode "mtls") (.Capabilities.APIVersions.Has "cert-manager.io/v1") }}
        - name: fleet-external-tls
          secret:
            secretName: {{ include "waddleai.fullname" . }}-fleet-external-client-tls
        {{- end }}
        {{- if and .Values.fleet.external.enabled (eq .Values.fleet.external.mode "token") }}
        - name: fleet-external-token-template
          configMap:
            name: {{ include "waddleai.fullname" . }}-fleet-external-token-proxy
        # nginx's envsubst entrypoint writes rendered config here, and nginx
        # itself needs cache/run writable — all three emptyDir so
        # readOnlyRootFilesystem: true still holds for this sidecar.
        - name: fleet-external-nginx-confd
          emptyDir: {}
        - name: fleet-external-nginx-cache
          emptyDir: {}
        - name: fleet-external-nginx-run
          emptyDir: {}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
