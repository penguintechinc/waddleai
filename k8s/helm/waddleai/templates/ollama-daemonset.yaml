{{/*
DaemonSet mode (default, ollama.mode != "pool") — one Ollama pod per
GPU-labeled node. See ollama-deployment.yaml for pool mode
(Deployment + nodeSelector, for mixed-GPU clusters). Both wrap the same
waddleai.ollama.podTemplate helper (_helpers.tpl) — pod spec stays
identical between the two; only the controller kind + replica semantics
differ (Task 14).
*/}}
{{- if and .Values.ollama.enabled (ne .Values.ollama.mode "pool") -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "waddleai.fullname" . }}-ollama
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "waddleai.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
spec:
  selector:
    matchLabels:
      {{- include "waddleai.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ollama
  template:
    {{- include "waddleai.ollama.podTemplate" . | nindent 4 }}
{{- end }}
