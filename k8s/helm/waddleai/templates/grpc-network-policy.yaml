{{/*
Proxy internal-gRPC ingress policy. CiliumNetworkPolicy (house rule: never
plain NetworkPolicy), same intent as the prior networking.k8s.io/v1 policy:
only pods matching proxy.grpc.networkPolicy.allowedPodSelectors (same
namespace) may reach the proxy pods on TCP 50051; fail-closed when the list is
empty. Guarded on the cilium.io/v2 capability like cilium-network-policy.yaml
so non-Cilium clusters (plain MicroK8s alpha) still install cleanly.
*/}}
{{- if and .Values.proxy.grpc.networkPolicy.enabled (.Capabilities.APIVersions.Has "cilium.io/v2") }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "waddleai.fullname" . }}-grpc
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "waddleai.labels" . | nindent 4 }}
    app: waddleai-proxy
spec:
  endpointSelector:
    matchLabels:
      app: waddleai-proxy
  ingress:
    {{- if .Values.proxy.grpc.networkPolicy.allowedPodSelectors }}
    - fromEndpoints:
        {{- range .Values.proxy.grpc.networkPolicy.allowedPodSelectors }}
        - {{- toYaml . | nindent 10 }}
        {{- end }}
      toPorts:
        - ports:
            - port: "50051"
              protocol: TCP
    {{- else }}
    # Default: no selectors allowed (fail-closed). `- {}` is ONE ingress rule
    # with no from*/toPorts, so it matches no peer (allows nothing) but its
    # presence puts the selected pods into ingress default-deny. Do NOT
    # replace it with `ingress: []`: Cilium derives default-deny from
    # len(ingress) > 0 (pkg/policy/api/rule_validation.go Sanitize), so an
    # empty list enforces nothing and leaves the pods open (fail-OPEN).
    # Explicitly configure allowedPodSelectors in values to permit access.
    - {}
    {{- end }}
{{- end }}
