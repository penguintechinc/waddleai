{{/*
PrometheusRule for the proxy (AIProxy) service (O2 fix). Error-rate/latency
expressions reference waddleai_requests_total/waddleai_request_duration_seconds
(shared/utils/metrics.py, recorded at proxy/apps/proxy_server/main.py's
after_request hook and per-route finally blocks) -- metrics that exist
today. LLM routes (/v1/chat/completions, /v1/messages,
/v1/messages/count_tokens) are excluded from the general latency SLO and
given their own, looser budget (upstream provider latency dominates and is
outside this service's control). waddleai_proxy_inflight_requests,
waddleai_proxy_concurrency_rejections_total, and
waddleai_proxy_stream_ttfb_seconds now exist (shared/utils/metrics.py,
release-audit-2026-10-02 O10) -- marked inline below. Two references
remain genuinely dangling (no metric was ever added for them, for
management/proxy, in any PR of that audit pass -- only penguincode got
db-pool instrumentation): a `proxy_concurrency_limit` gauge for the
configured admission-limiter cap, and `db_pool_waiting` for
management/proxy's own connection pools. Both are marked inline; the
alerts referencing them will never fire (PromQL against an absent series
returns no data, not an error) until that follow-up metric ships -- see
docs/operations/MONITORING.md.
*/}}
{{- if and .Values.monitoring.enabled .Values.monitoring.prometheusRule.enabled .Values.proxy.enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") -}}
{{- $slo := .Values.monitoring.prometheusRule.proxy.slo }}
{{- $llmPaths := "/v1/chat/completions|/v1/messages|/v1/messages/count_tokens" }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "waddleai.fullname" . }}-proxy
  namespace: {{ .Values.monitoring.namespace | default .Values.namespace }}
  labels:
    {{- include "waddleai.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
    {{- with .Values.monitoring.extraLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: waddleai-proxy.slo-error-budget-burn
      rules:
        - alert: ProxyErrorBudgetBurnFast
          expr: |
            (
              sum(rate(waddleai_requests_total{service="proxy",status_code=~"5.."}[{{ $slo.burnRateFast.longWindow }}]))
              /
              sum(rate(waddleai_requests_total{service="proxy"}[{{ $slo.burnRateFast.longWindow }}]))
            ) > {{ $slo.burnRateFast.threshold }}
            and
            (
              sum(rate(waddleai_requests_total{service="proxy",status_code=~"5.."}[{{ $slo.burnRateFast.shortWindow }}]))
              /
              sum(rate(waddleai_requests_total{service="proxy"}[{{ $slo.burnRateFast.shortWindow }}]))
            ) > {{ $slo.burnRateFast.threshold }}
          for: 2m
          labels:
            severity: critical
            service: proxy
            slo: error-budget-burn
          annotations:
            summary: "Proxy error budget burning fast"
            description: "Proxy 5xx ratio exceeded the fast-burn threshold over both the {{ $slo.burnRateFast.longWindow }} and {{ $slo.burnRateFast.shortWindow }} windows -- the {{ $slo.availabilityTargetPercent }}% SLO's {{ $slo.errorBudgetWindow }} budget empties in hours at this rate. See docs/operations/MONITORING.md#proxyerrorbudgetburnfast."
        - alert: ProxyErrorBudgetBurnMid
          expr: |
            (
              sum(rate(waddleai_requests_total{service="proxy",status_code=~"5.."}[{{ $slo.burnRateMid.longWindow }}]))
              /
              sum(rate(waddleai_requests_total{service="proxy"}[{{ $slo.burnRateMid.longWindow }}]))
            ) > {{ $slo.burnRateMid.threshold }}
            and
            (
              sum(rate(waddleai_requests_total{service="proxy",status_code=~"5.."}[{{ $slo.burnRateMid.shortWindow }}]))
              /
              sum(rate(waddleai_requests_total{service="proxy"}[{{ $slo.burnRateMid.shortWindow }}]))
            ) > {{ $slo.burnRateMid.threshold }}
          for: 5m
          labels:
            severity: critical
            service: proxy
            slo: error-budget-burn
          annotations:
            summary: "Proxy error budget burning"
            description: "Proxy 5xx ratio exceeded the mid-burn threshold over both the {{ $slo.burnRateMid.longWindow }} and {{ $slo.burnRateMid.shortWindow }} windows. See docs/operations/MONITORING.md#proxyerrorbudgetburnmid."
        - alert: ProxyErrorBudgetBurnSlow
          expr: |
            (
              sum(rate(waddleai_requests_total{service="proxy",status_code=~"5.."}[{{ $slo.burnRateSlow.longWindow }}]))
              /
              sum(rate(waddleai_requests_total{service="proxy"}[{{ $slo.burnRateSlow.longWindow }}]))
            ) > {{ $slo.burnRateSlow.threshold }}
            and
            (
              sum(rate(waddleai_requests_total{service="proxy",status_code=~"5.."}[{{ $slo.burnRateSlow.shortWindow }}]))
              /
              sum(rate(waddleai_requests_total{service="proxy"}[{{ $slo.burnRateSlow.shortWindow }}]))
            ) > {{ $slo.burnRateSlow.threshold }}
          for: 15m
          labels:
            severity: warning
            service: proxy
            slo: error-budget-burn
          annotations:
            summary: "Proxy error budget burning slowly"
            description: "Proxy 5xx ratio exceeded the slow-burn threshold over both the {{ $slo.burnRateSlow.longWindow }} and {{ $slo.burnRateSlow.shortWindow }} windows -- ticket, not page. See docs/operations/MONITORING.md#proxyerrorbudgetburnslow."
        - alert: ProxyErrorBudgetBurnSlowest
          expr: |
            (
              sum(rate(waddleai_requests_total{service="proxy",status_code=~"5.."}[{{ $slo.burnRateSlowest.longWindow }}]))
              /
              sum(rate(waddleai_requests_total{service="proxy"}[{{ $slo.burnRateSlowest.longWindow }}]))
            ) > {{ $slo.burnRateSlowest.threshold }}
            and
            (
              sum(rate(waddleai_requests_total{service="proxy",status_code=~"5.."}[{{ $slo.burnRateSlowest.shortWindow }}]))
              /
              sum(rate(waddleai_requests_total{service="proxy"}[{{ $slo.burnRateSlowest.shortWindow }}]))
            ) > {{ $slo.burnRateSlowest.threshold }}
          for: 30m
          labels:
            severity: warning
            service: proxy
            slo: error-budget-burn
          annotations:
            summary: "Proxy error budget burning (long-horizon)"
            description: "Proxy 5xx ratio exceeded the slowest-burn threshold over both the {{ $slo.burnRateSlowest.longWindow }} and {{ $slo.burnRateSlowest.shortWindow }} windows. See docs/operations/MONITORING.md#proxyerrorbudgetburnslowest."
    - name: waddleai-proxy.slo-latency
      rules:
        - alert: ProxyLatencyP95High
          expr: |
            histogram_quantile(0.95, sum(rate(waddleai_request_duration_seconds_bucket{service="proxy",endpoint!~"{{ $llmPaths }}"}[15m])) by (le)) > {{ $slo.latencyP95Seconds }}
          for: 15m
          labels:
            severity: warning
            service: proxy
            slo: latency
          annotations:
            summary: "Proxy non-LLM p95 latency above {{ $slo.latencyP95Seconds }}s"
            description: "p95 latency on non-LLM routes (LLM routes have their own budget below) exceeded {{ $slo.latencyP95Seconds }}s over 15m. See docs/operations/MONITORING.md#proxylatencyp95high."
        - alert: ProxyLatencyP99High
          expr: |
            histogram_quantile(0.99, sum(rate(waddleai_request_duration_seconds_bucket{service="proxy",endpoint!~"{{ $llmPaths }}"}[15m])) by (le)) > {{ $slo.latencyP99Seconds }}
          for: 15m
          labels:
            severity: critical
            service: proxy
            slo: latency
          annotations:
            summary: "Proxy non-LLM p99 latency above {{ $slo.latencyP99Seconds }}s"
            description: "p99 latency on non-LLM routes exceeded {{ $slo.latencyP99Seconds }}s over 15m. See docs/operations/MONITORING.md#proxylatencyp99high."
        - alert: ProxyLLMLatencyP95High
          expr: |
            histogram_quantile(0.95, sum(rate(waddleai_request_duration_seconds_bucket{service="proxy",endpoint=~"{{ $llmPaths }}"}[15m])) by (le)) > {{ $slo.llmLatencyP95Seconds }}
          for: 15m
          labels:
            severity: warning
            service: proxy
            slo: latency-llm
          annotations:
            summary: "Proxy LLM-route p95 latency above {{ $slo.llmLatencyP95Seconds }}s"
            description: "p95 latency on /v1/chat/completions, /v1/messages, /v1/messages/count_tokens exceeded their own (looser) {{ $slo.llmLatencyP95Seconds }}s budget over 15m -- check provider_health / upstream provider status before assuming a proxy regression. See docs/operations/MONITORING.md#proxyllmlatencyp95high."
    - name: waddleai-proxy.saturation
      rules:
        - alert: ProxyInflightSaturationHigh
          # waddleai_proxy_inflight_requests exists (shared/utils/metrics.py).
          # proxy_concurrency_limit does NOT -- no gauge for the configured
          # PROXY_MAX_CONCURRENT_PER_WORKER cap was ever added. This alert is
          # a known dangling reference: the expression evaluates against an
          # absent series and will never fire until that gauge ships. See
          # docs/operations/MONITORING.md#proxyinflightsaturationhigh.
          expr: |
            (waddleai_proxy_inflight_requests{service="proxy"} / proxy_concurrency_limit{job="waddleai-proxy"}) * 100 > {{ $slo.inflightSaturationPercent }}
          for: 5m
          labels:
            severity: warning
            service: proxy
            slo: saturation
          annotations:
            summary: "Proxy in-flight concurrency above {{ $slo.inflightSaturationPercent }}% of its cap"
            description: "The proxy's own request-admission limiter is near its ceiling -- expect 429 overloaded_error responses (ProxyConcurrencyRejections) and growing queueing latency. See docs/operations/MONITORING.md#proxyinflightsaturationhigh."
        - alert: ProxyConcurrencyRejectionsHigh
          expr: |
            sum(rate(waddleai_proxy_concurrency_rejections_total{}[10m])) > 0
          for: 10m
          labels:
            severity: warning
            service: proxy
            slo: saturation
          annotations:
            summary: "Proxy shedding load (429 overloaded_error)"
            description: "The proxy has rejected requests over capacity for 10m straight -- scale out (HPA) or raise the concurrency cap if this is sustained legitimate load. See docs/operations/MONITORING.md#proxyconcurrencyrejectionshigh."
    - name: waddleai-proxy.availability
      rules:
        - alert: ProxyTargetDown
          expr: up{job="waddleai-proxy"} == 0
          for: 5m
          labels:
            severity: critical
            service: proxy
            slo: availability
          annotations:
            summary: "Proxy scrape target down"
            description: "Prometheus has not successfully scraped waddleai-proxy for 5m. See docs/operations/MONITORING.md#proxytargetdown."
        - alert: ProxyMetricsAbsent
          expr: absent(up{job="waddleai-proxy"})
          for: 10m
          labels:
            severity: critical
            service: proxy
            slo: availability
          annotations:
            summary: "No proxy scrape target registered"
            description: "Prometheus has no waddleai-proxy target at all. See docs/operations/MONITORING.md#proxymetricsabsent."
    - name: waddleai-proxy.cause
      rules:
        - alert: ProxyProviderUnhealthy
          expr: waddleai_provider_health{} == 0
          for: 5m
          labels:
            severity: warning
            service: proxy
            slo: cause
          annotations:
            summary: "Proxy marked a provider endpoint unhealthy"
            description: "waddleai_provider_health is 0 for provider={{`{{ $labels.provider }}`}} endpoint={{`{{ $labels.endpoint }}`}} -- likely cause behind ProxyErrorBudgetBurn*/ProxyLLMLatencyP95High if the routing engine keeps sending traffic there. See docs/operations/MONITORING.md#proxyproviderunhealthy."
        - alert: ProxyDBPoolSaturated
          # Known dangling reference: no db_pool_waiting (or equivalent)
          # gauge exists for the proxy's DB connections today -- only
          # penguincode's own pool got this instrumentation in the
          # 2026-10 ops-remediation pass. This alert evaluates against an
          # absent series and will never fire until that metric ships.
          # See docs/operations/MONITORING.md#proxydbpoolsaturated.
          expr: db_pool_waiting{job="waddleai-proxy"} > 0
          for: 5m
          labels:
            severity: warning
            service: proxy
            slo: cause
          annotations:
            summary: "Proxy DB connection pool has waiters"
            description: "Requests are queueing for a DB connection. See docs/operations/MONITORING.md#proxydbpoolsaturated."
        - alert: ProxyRateLimitExceededHigh
          expr: sum(rate(waddleai_rate_limit_exceeded_total{}[10m])) > 0
          for: 10m
          labels:
            severity: warning
            service: proxy
            slo: cause
          annotations:
            summary: "Proxy rate limiting is actively rejecting requests"
            description: "waddleai_rate_limit_exceeded_total is incrementing -- confirm this is tenant abuse, not an under-provisioned quota for legitimate traffic. See docs/operations/MONITORING.md#proxyratelimitexceededhigh."
        - alert: ProxyCacheHitRateLow
          expr: |
            (
              sum(rate(waddleai_cache_lookups_total{result="hit"}[1h]))
              /
              sum(rate(waddleai_cache_lookups_total{}[1h]))
            ) < 0.05
          for: 1h
          labels:
            severity: warning
            service: proxy
            slo: cause
          annotations:
            summary: "Proxy response-cache hit rate below 5%"
            description: "The exact/semantic response cache's hit rate over the last hour fell below 5% -- either genuinely diverse traffic, or a cache-layer regression (TTL, key derivation) silently defeating it. See docs/operations/MONITORING.md#proxycachehitratelow."
        - alert: ProxyPodRestartingFrequently
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace="{{ .Values.namespace }}", pod=~".*proxy.*"}[1h]) > 3
          for: 5m
          labels:
            severity: warning
            service: proxy
            slo: cause
          annotations:
            summary: "Proxy pod restarting repeatedly"
            description: "A proxy pod restarted more than 3 times in the last hour -- check `kubectl logs --previous`. See docs/operations/MONITORING.md#proxypodrestartingfrequently."
        - alert: ProxyHPAAtMax
          expr: |
            kube_horizontalpodautoscaler_status_current_replicas{namespace="{{ .Values.namespace }}", horizontalpodautoscaler=~".*proxy.*"}
            >=
            kube_horizontalpodautoscaler_spec_max_replicas{namespace="{{ .Values.namespace }}", horizontalpodautoscaler=~".*proxy.*"}
          for: 10m
          labels:
            severity: warning
            service: proxy
            slo: cause
          annotations:
            summary: "Proxy HPA pinned at max replicas"
            description: "The proxy HPA has been at maxReplicas for 10m. See docs/operations/MONITORING.md#proxyhpaatmax."
        - alert: ProxyPDBViolated
          # Proxy's PodDisruptionBudget (templates/proxy-pdb.yaml) exists.
          expr: |
            kube_poddisruptionbudget_status_currenthealthy{namespace="{{ .Values.namespace }}", poddisruptionbudget=~".*proxy.*"}
            <
            kube_poddisruptionbudget_status_desiredhealthy{namespace="{{ .Values.namespace }}", poddisruptionbudget=~".*proxy.*"}
          for: 5m
          labels:
            severity: warning
            service: proxy
            slo: cause
          annotations:
            summary: "Proxy PodDisruptionBudget violated"
            description: "Fewer proxy pods are healthy than the PDB's minAvailable requires. See docs/operations/MONITORING.md#proxypdbviolated."
        - alert: ProxyFeatureFlagEvalErrors
          expr: |
            sum(rate(feature_flag_evaluations_total{service="proxy",result="error"}[15m])) > 0
          for: 15m
          labels:
            severity: warning
            service: proxy
            slo: cause
          annotations:
            summary: "Proxy feature-flag evaluations failing"
            description: "Flags are falling back to last-known-cached values; the cache is going stale if this persists. See docs/operations/MONITORING.md#proxyfeatureflagevalerrors."
        - alert: ProxyLicenseCheckErrors
          expr: |
            sum(rate(license_checks_total{service="proxy",status="error"}[15m])) > 0
          for: 15m
          labels:
            severity: warning
            service: proxy
            slo: cause
          annotations:
            summary: "Proxy license checks failing"
            description: "Calls to license.penguintech.io are erroring; entitlement checks are falling back to cached state. See docs/operations/MONITORING.md#proxylicensecheckerrors."
        - alert: ProxyContentFilterAuditorFailOpen
          # ops-remediation (content-filter guard degraded traceability): the
          # LLM auditor (shared/security/content_filter.py) being
          # unreachable/timing-out used to be silently indistinguishable from
          # an ordinary ALLOW -- waddleai_content_filter_fail_total{mode=
          # "fail_open"} is the counter that now actually increments for it.
          expr: |
            sum(rate(waddleai_content_filter_fail_total{mode="fail_open"}[15m])) > 0
          for: 15m
          labels:
            severity: warning
            service: proxy
            slo: cause
          annotations:
            summary: "Content-filter LLM auditor degraded, failing open"
            description: "The LLM auditor is unreachable/timing out/returning non-200 and SECURITY_AUDITOR_FAIL_MODE=open is letting the rule-based tiers-1-3 decision through unaudited. Check Ollama/the auditor endpoint directly; waddleai_security_auditor_duration_seconds{outcome=\"degraded\"} shows the failure rate. See docs/operations/MONITORING.md#proxycontentfilterauditorfailopen."
        - alert: ProxyContentFilterAuditorFailClosed
          expr: |
            sum(rate(waddleai_content_filter_fail_total{mode="fail_closed"}[15m])) > 0
          for: 15m
          labels:
            severity: warning
            service: proxy
            slo: cause
          annotations:
            summary: "Content-filter blocking traffic due to a degraded/defective auditor"
            description: "Either SECURITY_AUDITOR_FAIL_MODE=closed is blocking requests because the LLM auditor is degraded, or a programming defect in the auditor call path is blocking unconditionally -- check logs for \"LLM auditor degraded\" vs \"LLM auditor call is broken\" to tell them apart. See docs/operations/MONITORING.md#proxycontentfilterauditorfailclosed."
{{- end }}
