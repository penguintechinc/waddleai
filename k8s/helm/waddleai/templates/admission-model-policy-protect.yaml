{{/*
ValidatingAdmissionPolicy: the management ServiceAccount may not UPDATE or DELETE CHART-OWNED
model-pod isolation objects (labelled app.kubernetes.io/managed-by=Helm): any
TracingPolicyNamespaced, and CiliumNetworkPolicies named waddleai-model-* / waddleai-vllm-ray-*.
Fleet-generated objects carry managed-by=waddleai-fleet and stay manageable. Same capability
guard as the other VAPs; validationActions defaults to Deny here (see values.yaml) because a Warn
would protect nothing.
*/}}
{{- if and .Values.modelPodSecurity.networkPolicy.protectChartPolicies.enabled .Values.admissionPolicies.enabled .Values.admissionPolicies.validatingAdmissionPolicy.enabled (or .Values.admissionPolicies.forceRender (.Capabilities.APIVersions.Has "admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy")) -}}
{{- $sa := printf "system:serviceaccount:%s:%s" .Values.namespace (include "waddleai.serviceAccountName" .) }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "waddleai.fullname" . }}-protect-model-policies
  labels:
    {{- include "waddleai.labels" . | nindent 4 }}
spec:
  failurePolicy: {{ .Values.admissionPolicies.failurePolicy }}
  matchConstraints:
    resourceRules:
      - apiGroups: ["cilium.io"]
        apiVersions: ["v1alpha1"]
        operations: ["UPDATE", "DELETE"]
        resources: ["tracingpoliciesnamespaced"]
      - apiGroups: ["cilium.io"]
        apiVersions: ["v2"]
        operations: ["UPDATE", "DELETE"]
        resources: ["ciliumnetworkpolicies"]
  variables:
    - name: chartOwned
      expression: "has(oldObject.metadata.labels) && 'app.kubernetes.io/managed-by' in oldObject.metadata.labels && oldObject.metadata.labels['app.kubernetes.io/managed-by'] == 'Helm'"
    - name: modelPolicy
      expression: "oldObject.kind == 'TracingPolicyNamespaced' || oldObject.metadata.name.startsWith('waddleai-model-') || oldObject.metadata.name.startsWith('waddleai-vllm-ray-')"
  validations:
    - expression: "!(request.userInfo.username == '{{ $sa }}' && variables.chartOwned && variables.modelPolicy)"
      message: "the management service account may not modify or delete chart-owned (Helm) model-pod isolation policies"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "waddleai.fullname" . }}-protect-model-policies-binding
  labels:
    {{- include "waddleai.labels" . | nindent 4 }}
spec:
  policyName: {{ include "waddleai.fullname" . }}-protect-model-policies
  validationActions: {{ .Values.modelPodSecurity.networkPolicy.protectChartPolicies.validationActions | toJson }}
{{- end }}
