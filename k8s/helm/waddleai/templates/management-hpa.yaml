{{/*
HorizontalPodAutoscaler for the Management service (O4: "No HPA anywhere" --
management is stateless behind management-service.yaml's ClusterIP, so it's
safe to scale on demand instead of running a fixed replicaCount everywhere.
Guarded by both management.enabled and management.autoscaling.enabled so a
values file that disables the service, or an operator without a
metrics-server, gets a clean no-op instead of a dangling HPA pointed at a
Deployment that doesn't exist / can never report metrics.
*/}}
{{- if and .Values.management.enabled .Values.management.autoscaling.enabled -}}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "waddleai.fullname" . }}-management
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "waddleai.labels" . | nindent 4 }}
    app.kubernetes.io/component: management
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "waddleai.fullname" . }}-management
  minReplicas: {{ .Values.management.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.management.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.management.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.management.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.management.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.management.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
