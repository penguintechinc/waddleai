{{- if .Values.fleet.vllmRay.enabled }}
# Per-deployment API keys (AM16). Data key = deployment slug, value = token. Written only by
# management (C2c) at runtime; the chart ships it empty and re-emits whatever is already there so
# `helm upgrade` never wipes live keys.
{{- $existing := lookup "v1" "Secret" .Values.namespace "waddleai-vllm-deployment-keys" }}
apiVersion: v1
kind: Secret
metadata:
  name: waddleai-vllm-deployment-keys
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "waddleai.labels" . | nindent 4 }}
    app.kubernetes.io/component: vllm-deployment-keys
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
{{- if and $existing $existing.data }}
data:
  {{- toYaml $existing.data | nindent 2 }}
{{- end }}
{{- end }}
