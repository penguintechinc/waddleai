{{- if and .Values.fleet.vllmRay.enabled .Values.fleet.vllmRay.hotCache.enabled .Values.fleet.vllmRay.hotCache.kyvernoPolicyException }}
# D5 option b: exempt ONLY Ray worker pods from the host-path policy instead of relaxing the
# namespace Pod Security Admission level. Policy names come from fleet.vllmRay.hotCache.kyvernoPolicyNames.
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: waddleai-vllm-ray-hot-cache
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "waddleai.labels" . | nindent 4 }}
spec:
  exceptions:
    {{- range .Values.fleet.vllmRay.hotCache.kyvernoPolicyNames }}
    - policyName: {{ . }}
      ruleNames:
        - "*"
    {{- end }}
  match:
    any:
      - resources:
          kinds:
            - Pod
          namespaces:
            - {{ .Values.namespace }}
          selector:
            matchLabels:
              app.kubernetes.io/component: ray-worker
{{- end }}
