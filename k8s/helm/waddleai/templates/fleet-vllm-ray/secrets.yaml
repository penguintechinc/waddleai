{{- if .Values.fleet.vllmRay.enabled }}
{{- $sec := .Values.fleet.security }}
{{- /* Ray token: generated only when neither an env Secret nor an existingSecret is supplied. */}}
{{- if not (or $sec.rayAuthToken.existingSecret $sec.rayAuthToken.envSecret) }}
{{- $existing := lookup "v1" "Secret" .Values.namespace "waddleai-ray-auth" }}
{{- $token := randAlphaNum 48 | b64enc }}
{{- if and $existing $existing.data (index $existing.data "token") }}
{{- $token = index $existing.data "token" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: waddleai-ray-auth
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "waddleai.labels" . | nindent 4 }}
    app.kubernetes.io/component: ray-auth
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  token: {{ $token }}
---
{{- end }}
{{- /* Connection-link token encryption key: a Fernet key (32 random bytes, urlsafe base64). */}}
{{- if not $sec.tokenEncryptionKey.existingSecret }}
{{- $existingKey := lookup "v1" "Secret" .Values.namespace "waddleai-fleet-token-key" }}
{{- $fernet := randAlphaNum 32 | b64enc | b64enc }}
{{- if and $existingKey $existingKey.data (index $existingKey.data "fernet") }}
{{- $fernet = index $existingKey.data "fernet" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: waddleai-fleet-token-key
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "waddleai.labels" . | nindent 4 }}
    app.kubernetes.io/component: fleet-token-key
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  fernet: {{ $fernet }}
{{- end }}
{{- end }}
