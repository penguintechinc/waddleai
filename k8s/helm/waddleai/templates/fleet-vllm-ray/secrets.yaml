{{- /*
Generated fleet Secrets (Ray auth token, connection-link Fernet key) come from a pre-install,
pre-upgrade hook Job, NOT from template-time generation: the Helm lookup function returns empty under
`helm template`, ArgoCD and --dry-run, so a template-generated value would regenerate on every
render. The Job creates each Secret ONLY IF ABSENT (HTTP 409 = keep the existing one), never
overwrites, never prints values. Precedence env > existingSecret > generated: a key supplied
externally is not generated, and with nothing to generate no Job/RBAC renders at all.
Pod labels follow migration-job.yaml (component=management plus a never-ready probe) so the pod
inherits management's Cilium egress (API server) and Tetragon allowlist.
*/}}
{{- if .Values.fleet.vllmRay.enabled }}
{{- $sec := .Values.fleet.security }}
{{- $genToken := not (or $sec.rayAuthToken.existingSecret $sec.rayAuthToken.envSecret) }}
{{- $genKey := not $sec.tokenEncryptionKey.existingSecret }}
{{- if or $genToken $genKey }}
{{- $name := "waddleai-fleet-secret-init" }}
{{- $hookAnn := dict "helm.sh/hook" "pre-install,pre-upgrade" "helm.sh/hook-delete-policy" "before-hook-creation,hook-succeeded" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "waddleai.labels" . | nindent 4 }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-30") $hookAnn) | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "waddleai.labels" . | nindent 4 }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-30") $hookAnn) | nindent 4 }}
rules:
  # get: limited to the exact generated Secret names. create: RBAC cannot restrict `create` by
  # resourceNames (the name is unknown at authorization time), so it is namespace-scoped.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames:
      {{- if $genToken }}
      - waddleai-ray-auth
      {{- end }}
      {{- if $genKey }}
      - waddleai-fleet-token-key
      {{- end }}
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "waddleai.labels" . | nindent 4 }}
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-25") $hookAnn) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Values.namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "waddleai.labels" . | nindent 4 }}
    app.kubernetes.io/component: management
  annotations:
    {{- toYaml (merge (dict "helm.sh/hook-weight" "-20") $hookAnn) | nindent 4 }}
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "waddleai.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: management
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $name }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: init-secrets
          image: {{ include "waddleai.management.image" . }}
          imagePullPolicy: {{ .Values.management.image.pullPolicy }}
          securityContext:
            {{- toYaml (mergeOverwrite (deepCopy .Values.securityContext) (dict "readOnlyRootFilesystem" true)) | nindent 12 }}
          readinessProbe:
            exec:
              command: ["/opt/venv/bin/python3", "-c", "raise SystemExit(1)"]
            periodSeconds: 10
            failureThreshold: 1000
          command:
            - /opt/venv/bin/python3
            - -c
            - |
              import base64, json, os, secrets, ssl, sys, urllib.error, urllib.request

              def new_value(kind):
                  if kind == "fernet":
                      try:
                          from cryptography.fernet import Fernet
                          return Fernet.generate_key().decode()
                      except ImportError:
                          return base64.urlsafe_b64encode(os.urandom(32)).decode()
                  return secrets.token_urlsafe(36)

              sa = "/var/run/secrets/kubernetes.io/serviceaccount"
              ns = sys.argv[1]
              with open(sa + "/token") as fh:
                  bearer = fh.read().strip()
              ctx = ssl.create_default_context(cafile=sa + "/ca.crt")
              host = os.environ["KUBERNETES_SERVICE_HOST"]
              port = os.environ.get("KUBERNETES_SERVICE_PORT", "443")
              url = "https://%s:%s/api/v1/namespaces/%s/secrets" % (host, port, ns)
              for spec in sys.argv[2:]:
                  name, key, kind = spec.split(":")
                  body = {
                      "apiVersion": "v1", "kind": "Secret",
                      "metadata": {"name": name, "namespace": ns},
                      "type": "Opaque",
                      "data": {key: base64.b64encode(new_value(kind).encode()).decode()},
                  }
                  req = urllib.request.Request(
                      url, data=json.dumps(body).encode(), method="POST",
                      headers={"Authorization": "Bearer " + bearer,
                               "Content-Type": "application/json"})
                  try:
                      urllib.request.urlopen(req, context=ctx, timeout=30)
                      print("created secret " + name)
                  except urllib.error.HTTPError as err:
                      if err.code != 409:
                          raise
                      print("secret " + name + " already exists, kept")
            - {{ .Values.namespace | quote }}
            {{- if $genToken }}
            - "waddleai-ray-auth:token:token"
            {{- end }}
            {{- if $genKey }}
            - "waddleai-fleet-token-key:fernet:fernet"
            {{- end }}
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
