{{- if .Values.ollama.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "waddleai.fullname" . }}-ollama
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "waddleai.labels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
spec:
  # ClusterIP is not configurable (spec §10.3): Ollama has no native auth, so
  # the AIProxy-only CiliumNetworkPolicy (waddleai-allow-fleet-ingress in
  # cilium-network-policy.yaml) is the entire access-control story. A
  # NodePort/LoadBalancer would bypass that policy's in-cluster-only
  # assumption entirely.
  type: ClusterIP
  ports:
    - port: {{ .Values.ollama.service.port }}
      targetPort: {{ .Values.ollama.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "waddleai.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ollama
{{- end }}
