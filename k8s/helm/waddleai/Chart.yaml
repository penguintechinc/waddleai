apiVersion: v2
name: waddleai
description: WaddleAI - AI Infrastructure Management Platform
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - ai
  - llm
  - infrastructure
  - management
home: https://github.com/penguintechinc/waddleai
sources:
  - https://github.com/penguintechinc/waddleai
maintainers:
  - name: Penguin Tech Inc
    email: support@penguintech.io
    url: https://www.penguintech.io

dependencies:
  # NVIDIA GPU Operator — manages driver, container toolkit, device plugin, and GFD end-to-end.
  # Enable via: nvidia-gpu-operator.enabled=true
  # Repo: helm repo add nvidia https://helm.ngc.nvidia.com/nvidia
  - name: gpu-operator
    alias: nvidia-gpu-operator
    version: "v26.3.1"
    repository: "https://helm.ngc.nvidia.com/nvidia"
    condition: nvidia-gpu-operator.enabled
  # AMD ROCm device plugin — vendored local subchart (charts/amd-rocm-plugin).
  # Enable via: amd-rocm-plugin.enabled=true
  - name: amd-rocm-plugin
    version: "6.4.0"
    repository: "file://charts/amd-rocm-plugin"
    condition: amd-rocm-plugin.enabled
  # Intel GPU device plugin — vendored local subchart (charts/intel-gpu-plugin).
  # Enable via: intel-gpu-plugin.enabled=true
  - name: intel-gpu-plugin
    version: "0.31.0"
    repository: "file://charts/intel-gpu-plugin"
    condition: intel-gpu-plugin.enabled
