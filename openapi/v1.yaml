  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
info:
  title: WaddleAI Management API
  version: '1'
openapi: 3.1.0
paths:
  /api/v1/auth/change-password:
    post:
      description: ''
      operationId: post_change_password
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              description: Request body for POST /api/v1/auth/change-password.
              properties:
                current_password:
                  anyOf:
                  - type: string
                  - type: 'null'
                  default: null
                  title: Current Password
                new_password:
                  anyOf:
                  - type: string
                  - type: 'null'
                  default: null
                  title: New Password
              title: ChangePasswordRequest
              type: object
      responses:
        '200':
          content:
            application/json:
              schema:
                description: 'Generic `{"message": str}` envelope used by several
                  auth endpoints.'
                properties:
                  message:
                    title: Message
                    type: string
                required:
                - message
                title: MessageResponse
                type: object
          description: 'Generic `{"message": str}` envelope used by several auth endpoints.'
      security:
      - bearerAuth: []
      summary: Change user password.
      tags:
      - Auth
  /api/v1/auth/login:
    post:
      description: '

        Repeated failed attempts against the same account are rate limited and

        answered with 429 and a Retry-After header.'
      operationId: post_login
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              description: Credentials for POST /api/v1/auth/login.
              properties:
                password:
                  anyOf:
                  - type: string
                  - type: 'null'
                  default: null
                  title: Password
                username:
                  anyOf:
                  - type: string
                  - type: 'null'
                  default: null
                  title: Username
              title: LoginRequest
              type: object
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Response body for a successful login.
                properties:
                  access_token:
                    title: Access Token
                    type: string
                  expires_in:
                    title: Expires In
                    type: integer
                  token_type:
                    title: Token Type
                    type: string
                  user:
                    $ref: '#/components/schemas/LoginUser'
                required:
                - access_token
                - token_type
                - expires_in
                - user
                title: LoginResponse
                type: object
          description: Response body for a successful login.
      summary: Authenticate a user and issue a bearer access token.
      tags:
      - Auth
  /api/v1/auth/logout:
    post:
      description: '

        The token is rejected on every subsequent request from here on, until the

        point it would have expired on its own.'
      operationId: post_logout
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                description: 'Generic `{"message": str}` envelope used by several
                  auth endpoints.'
                properties:
                  message:
                    title: Message
                    type: string
                required:
                - message
                title: MessageResponse
                type: object
          description: 'Generic `{"message": str}` envelope used by several auth endpoints.'
      security:
      - bearerAuth: []
      summary: Revoke the caller's bearer token server-side.
      tags:
      - Auth
  /api/v1/auth/me:
    get:
      description: ''
      operationId: get_get_current_user
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Response body for GET /api/v1/auth/me.
                properties:
                  created_at:
                    anyOf:
                    - type: string
                    - type: 'null'
                    title: Created At
                  email:
                    title: Email
                    type: string
                  enabled:
                    title: Enabled
                    type: boolean
                  id:
                    title: Id
                    type: integer
                  last_login_at:
                    anyOf:
                    - type: string
                    - type: 'null'
                    title: Last Login At
                  organization:
                    anyOf:
                    - $ref: '#/components/schemas/CurrentUserOrganization'
                    - type: 'null'
                  role:
                    title: Role
                    type: string
                  token_quota_daily:
                    anyOf:
                    - type: integer
                    - type: 'null'
                    title: Token Quota Daily
                  token_quota_monthly:
                    anyOf:
                    - type: integer
                    - type: 'null'
                    title: Token Quota Monthly
                  username:
                    title: Username
                    type: string
                required:
                - id
                - username
                - email
                - role
                - organization
                - token_quota_daily
                - token_quota_monthly
                - enabled
                - created_at
                - last_login_at
                title: CurrentUserResponse
                type: object
          description: Response body for GET /api/v1/auth/me.
      security:
      - bearerAuth: []
      summary: Get current user info.
      tags:
      - Auth
  /api/v1/auth/refresh:
    post:
      description: ''
      operationId: post_refresh_token
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Response body for a successful token refresh.
                properties:
                  access_token:
                    title: Access Token
                    type: string
                  expires_in:
                    title: Expires In
                    type: integer
                  token_type:
                    title: Token Type
                    type: string
                required:
                - access_token
                - token_type
                - expires_in
                title: RefreshTokenResponse
                type: object
          description: Response body for a successful token refresh.
      security:
      - bearerAuth: []
      summary: Refresh JWT token.
      tags:
      - Auth
  /api/v1/auth/verify:
    get:
      description: ''
      operationId: get_verify_auth
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Response body for GET /api/v1/auth/verify.
                properties:
                  user:
                    $ref: '#/components/schemas/VerifyUser'
                required:
                - user
                title: VerifyResponse
                type: object
          description: Response body for GET /api/v1/auth/verify.
      security:
      - bearerAuth: []
      summary: Verify the caller's bearer token and echo back its identity claims.
      tags:
      - Auth
  /api/v1/cache-configs:
    get:
      description: ''
      operationId: get_list_cache_configs
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                description: List success envelope for GET /api/v1/cache-configs.
                properties:
                  data:
                    items:
                      $ref: '#/components/schemas/CacheConfigItem'
                    title: Data
                    type: array
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'
                  status:
                    title: Status
                    type: string
                required:
                - status
                - data
                - pagination
                title: CacheConfigListEnvelope
                type: object
          description: List success envelope for GET /api/v1/cache-configs.
      summary: List cache configs, optionally filtered by scope_type/scope_ref, paginated.
    post:
      description: ''
      operationId: post_create_cache_config
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              description: Request body for POST /api/v1/cache-configs.
              properties:
                anthropic_cache_control:
                  anyOf:
                  - type: boolean
                  - type: 'null'
                  default: null
                  title: Anthropic Cache Control
                exact_enabled:
                  anyOf:
                  - type: boolean
                  - type: 'null'
                  default: null
                  title: Exact Enabled
                max_entry_kb:
                  anyOf:
                  - type: integer
                  - type: 'null'
                  default: null
                  title: Max Entry Kb
                scope_ref:
                  anyOf:
                  - type: string
                  - type: 'null'
                  default: null
                  title: Scope Ref
                scope_type:
                  anyOf:
                  - type: string
                  - type: 'null'
                  default: null
                  title: Scope Type
                semantic_enabled:
                  anyOf:
                  - type: boolean
                  - type: 'null'
                  default: null
                  title: Semantic Enabled
                semantic_threshold:
                  anyOf:
                  - type: number
                  - type: 'null'
                  default: null
                  title: Semantic Threshold
                ttl_seconds:
                  anyOf:
                  - type: integer
                  - type: 'null'
                  default: null
                  title: Ttl Seconds
              title: CacheConfigCreateRequest
              type: object
      responses:
        '201':
          content:
            application/json:
              schema:
                description: Single-row success envelope for get/create/update.
                properties:
                  data:
                    $ref: '#/components/schemas/CacheConfigItem'
                  status:
                    title: Status
                    type: string
                required:
                - status
                - data
                title: CacheConfigEnvelope
                type: object
          description: Single-row success envelope for get/create/update.
      summary: Create a new cache config row for a scope. 409 if the scope already
        has one.
  /api/v1/cache-configs/{config_id}:
    delete:
      description: ''
      operationId: delete_delete_cache_config
      parameters:
      - in: path
        name: config_id
        required: true
        schema:
          type: number
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Success envelope for DELETE /api/v1/cache-configs/<id>.
                properties:
                  data:
                    $ref: '#/components/schemas/CacheConfigDeleted'
                  status:
                    title: Status
                    type: string
                required:
                - status
                - data
                title: CacheConfigDeleteEnvelope
                type: object
          description: Success envelope for DELETE /api/v1/cache-configs/<id>.
      summary: Delete a cache config row (falls back to the next-broader scope).
    get:
      description: ''
      operationId: get_get_cache_config
      parameters:
      - in: path
        name: config_id
        required: true
        schema:
          type: number
