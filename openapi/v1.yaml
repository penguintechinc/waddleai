      summary: List cache configs, optionally filtered by scope_type/scope_ref.
    post:
      description: ''
      operationId: post_create_cache_config
      parameters: []
      responses:
        '200': *id001
      summary: Create a new cache config row for a scope. 409 if the scope already
        has one.
  /api/v1/cache-configs/{config_id}:
    delete:
      description: ''
      operationId: delete_delete_cache_config
      parameters:
      - in: path
        name: config_id
        required: true
        schema:
          type: number
      responses:
        '200': *id001
      summary: Delete a cache config row (falls back to the next-broader scope).
    get:
      description: ''
      operationId: get_get_cache_config
      parameters:
      - in: path
        name: config_id
        required: true
        schema:
          type: number
      responses:
        '200': *id001
      summary: Get a single cache config row by ID.
    put:
      description: ''
      operationId: put_update_cache_config
      parameters:
      - in: path
        name: config_id
        required: true
        schema:
          type: number
      responses:
        '200': *id001
      summary: Update an existing cache config row.
  /api/v1/cilium/reconcile:
    post:
      description: ''
      operationId: post_cilium_reconcile
      parameters: []
      responses:
        '200': *id001
      summary: Trigger an on-demand reconcile and return the resulting status (admin
        only).
  /api/v1/cilium/status:
    get:
      description: '

        Always 200 (never 500) even when Cilium CRDs are entirely absent from the

        cluster — that is a normal, expected state on non-Cilium clusters (§12.3),

        not a server error.'
      operationId: get_cilium_status
      parameters: []
      responses:
        '200': *id001
      summary: Report Cilium CRD capabilities + the most recent reconcile outcome
        (admin only).
  /api/v1/docs:
    get:
      description: ''
      operationId: get_swagger_docs_ui
      parameters: []
      responses:
        '200': *id001
      summary: Authenticated Swagger UI, rendered against the gated full spec.
  /api/v1/embedding-config:
    get:
      description: ''
      operationId: get_get_embedding_config
      parameters: []
      responses:
