        '200':
          content:
            application/json:
              schema:
                description: Response body for GET /api/v1/auth/me.
                properties:
                  created_at:
                    anyOf:
                    - type: string
                    - type: 'null'
                    title: Created At
                  email:
                    title: Email
                    type: string
                  enabled:
                    title: Enabled
                    type: boolean
                  id:
                    title: Id
                    type: integer
                  last_login_at:
                    anyOf:
                    - type: string
                    - type: 'null'
                    title: Last Login At
                  organization:
                    anyOf:
                    - $ref: '#/components/schemas/CurrentUserOrganization'
                    - type: 'null'
                  role:
                    title: Role
                    type: string
                  token_quota_daily:
                    anyOf:
                    - type: integer
                    - type: 'null'
                    title: Token Quota Daily
                  token_quota_monthly:
                    anyOf:
                    - type: integer
                    - type: 'null'
                    title: Token Quota Monthly
                  username:
                    title: Username
                    type: string
                required:
                - id
                - username
                - email
                - role
                - organization
                - token_quota_daily
                - token_quota_monthly
                - enabled
