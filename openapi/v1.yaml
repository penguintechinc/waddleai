    post:
      description: '

        The correction only supersedes the original when it wins by trust ->

        confirmation -> recency (:func:`shared.knowledge.scoping.resolve_conflict`);

        a lower-trust "correction" of a verified fact is itself quarantined

        instead, never silently overwriting higher-trust knowledge.'
      operationId: post_memory_correct
      parameters:
      - in: path
        name: item_id
        required: true
        schema:
          type: number
      requestBody:
        content:
          application/json:
            schema:
              description: Request body for POST /api/v1/memory/<id>/correct.
              properties:
                content:
                  anyOf:
                  - type: string
                  - type: 'null'
                  default: null
                  title: Content
              title: MemoryCorrectRequest
              type: object
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Response body for a successful memory correction.
                properties:
                  new_id:
                    title: New Id
                    type: integer
                  old_id:
                    title: Old Id
                    type: integer
                  resolution_reason:
                    title: Resolution Reason
                    type: string
                  status:
                    title: Status
                    type: string
                  version:
                    title: Version
                    type: integer
                required:
                - status
                - old_id
                - new_id
                - version
                - resolution_reason
                title: MemoryCorrectResponse
                type: object
          description: Response body for a successful memory correction.
      summary: Version a memory with a correction; resolve by trust before superseding
        (§9.7).
