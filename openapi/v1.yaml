info:
  title: WaddleAI Management API
  version: '1'
openapi: 3.1.0
paths:
  /api/v1/auth/change-password:
    post:
      description: ''
      operationId: post_change_password
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              description: Request body for POST /api/v1/auth/change-password.
              properties:
                current_password:
                  anyOf:
                  - type: string
                  - type: 'null'
                  default: null
                  title: Current Password
                new_password:
                  anyOf:
                  - type: string
                  - type: 'null'
                  default: null
                  title: New Password
              title: ChangePasswordRequest
              type: object
      responses:
        '200':
          content:
            application/json:
              schema:
                description: 'Generic `{"message": str}` envelope used by several
                  auth endpoints.'
                properties:
                  message:
                    title: Message
                    type: string
                required:
                - message
                title: MessageResponse
                type: object
          description: 'Generic `{"message": str}` envelope used by several auth endpoints.'
      security:
      - bearerAuth: []
      summary: Change user password
      tags:
      - Auth
  /api/v1/auth/login:
    post:
      description: ''
      operationId: post_login
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              description: Credentials for POST /api/v1/auth/login.
              properties:
                password:
                  anyOf:
                  - type: string
                  - type: 'null'
                  default: null
                  title: Password
                username:
                  anyOf:
                  - type: string
                  - type: 'null'
                  default: null
                  title: Username
              title: LoginRequest
              type: object
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Response body for a successful login.
                properties:
                  access_token:
                    title: Access Token
                    type: string
                  expires_in:
                    title: Expires In
                    type: integer
                  token_type:
                    title: Token Type
                    type: string
                  user:
                    $ref: '#/components/schemas/LoginUser'
                required:
                - access_token
                - token_type
                - expires_in
                - user
                title: LoginResponse
                type: object
          description: Response body for a successful login.
      summary: User login endpoint
      tags:
      - Auth
  /api/v1/auth/logout:
    post:
      description: ''
      operationId: post_logout
      parameters: []
      responses:
        '200':
          content:
            application/json:
              schema:
                description: 'Generic `{"message": str}` envelope used by several
                  auth endpoints.'
                properties:
                  message:
                    title: Message
                    type: string
                required:
                - message
                title: MessageResponse
                type: object
          description: 'Generic `{"message": str}` envelope used by several auth endpoints.'
      security:
      - bearerAuth: []
      summary: User logout endpoint
      tags:
      - Auth
  /api/v1/auth/me:
    get:
