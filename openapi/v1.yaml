  /api/v1/users/{user_id}/erase:
    post:
      description: '

        A user erases their own account; an org-admin (USER_MANAGE, own org) or an

        admin (USER_CREATE, any org) may erase a user in scope. Every direct-PII

        column is replaced with a non-reversible tombstone and the account disabled;

        the row is retained so id references from other tables keep resolving

        (PII-tokenization design). Statutory -- never gated on a licence tier.'
      operationId: post_erase_user_data
      parameters:
      - in: path
        name: user_id
        required: true
        schema:
          type: number
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Response body for POST /api/v1/users/<user_id>/erase
                  (right to erasure).
                properties:
                  anonymized_fields:
                    items:
                      type: string
                    title: Anonymized Fields
                    type: array
                  erased:
                    title: Erased
                    type: boolean
                  message:
                    title: Message
                    type: string
                  user_id:
                    title: User Id
                    type: integer
                required:
                - message
                - user_id
                - erased
                - anonymized_fields
                title: ErasureResponse
                type: object
          description: Response body for POST /api/v1/users/<user_id>/erase (right
            to erasure).
      summary: 'DSAR right to erasure (GDPR Art. 17): anonymize a user''s PII in place.'
  /api/v1/users/{user_id}/export:
    get:
      description: '

        A user exports their own record; an org-admin (USER_MANAGE, own org) or an

        admin (USER_CREATE, any org) may export a user in scope. Returns the

        identity record (minus the password hash) plus a manifest of every table

        that holds data about the subject. Statutory -- authenticated + owned/scoped

        only, never gated on a licence entitlement.'
      operationId: get_export_user_data
      parameters:
      - in: path
        name: user_id
        required: true
        schema:
          type: number
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Response body for GET /api/v1/users/<user_id>/export
                  (right of access).
                properties:
                  generated_at:
                    title: Generated At
                    type: string
                  identity:
                    $ref: '#/components/schemas/ExportedIdentity'
                  manifest:
                    items:
                      $ref: '#/components/schemas/DataHoldingManifestEntry'
                    title: Manifest
                    type: array
                  notice:
                    title: Notice
                    type: string
                  subject_user_id:
                    title: Subject User Id
                    type: integer
                required:
                - subject_user_id
                - generated_at
                - identity
                - manifest
                - notice
                title: UserDataExportResponse
                type: object
          description: Response body for GET /api/v1/users/<user_id>/export (right
            of access).
      summary: 'DSAR right of access (GDPR Art. 15): export the personal data held
        about a user.'
