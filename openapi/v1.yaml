                  default: shared
                  title: Identity Mode
                name:
                  anyOf:
                  - type: string
                  - type: 'null'
                  default: null
                  title: Name
                namespace:
                  anyOf:
                  - type: string
                  - type: 'null'
                  default: null
                  title: Namespace
                transport:
                  anyOf:
                  - type: string
                  - type: 'null'
                  default: null
