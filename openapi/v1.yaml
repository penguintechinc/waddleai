                  llama.cpp endpoints.'
                properties:
                  message:
                    title: Message
                    type: string
                required:
                - message
                title: MessageResponse
                type: object
          description: 'Generic ``{"message": str}`` envelope used by several llama.cpp
            endpoints.'
      summary: Update a llama.cpp deployment (can only update stopped deployments).
