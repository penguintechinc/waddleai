      parameters:
      - in: path
        name: deployment_id
        required: true
        schema:
          type: number
      responses:
        '200':
          content:
            application/json:
              schema:
                description: 'Health-check response -- the union of every 200 branch''s
                  fields.


                  Only ``status`` is always present; the remaining fields are populated
                  per

                  branch (``reason`` when no endpoint is set, ``endpoint`` when healthy,

                  ``http_status``/``error`` when unhealthy) and default to ``None``
                  otherwise.'
                properties:
                  endpoint:
                    anyOf:
                    - type: string
                    - type: 'null'
                    default: null
                    title: Endpoint
                  error:
                    anyOf:
                    - type: string
                    - type: 'null'
                    default: null
                    title: Error
                  http_status:
                    anyOf:
                    - type: integer
                    - type: 'null'
                    default: null
                    title: Http Status
                  reason:
                    anyOf:
                    - type: string
                    - type: 'null'
                    default: null
                    title: Reason
                  status:
                    title: Status
                    type: string
                required:
                - status
                title: LlamaCppHealthResponse
                type: object
          description: 'Health-check response -- the union of every 200 branch''s
            fields.


            Only ``status`` is always present; the remaining fields are populated
            per

            branch (``reason`` when no endpoint is set, ``endpoint`` when healthy,

            ``http_status``/``error`` when unhealthy) and default to ``None`` otherwise.'
      summary: Check the health status of a llama.cpp deployment.
