                    - type: string
                    - type: 'null'
                    title: Endpoint Url
                  gpu_count:
                    anyOf:
                    - type: integer
                    - type: 'null'
                    title: Gpu Count
                  id:
                    title: Id
                    type: integer
                  k8s_daemonset_name:
                    anyOf:
                    - type: string
                    - type: 'null'
                    title: K8S Daemonset Name
                  k8s_namespace:
                    anyOf:
                    - type: string
                    - type: 'null'
                    title: K8S Namespace
                  model_filename:
                    anyOf:
                    - type: string
                    - type: 'null'
                    title: Model Filename
                  model_name:
                    anyOf:
                    - type: string
                    - type: 'null'
                    title: Model Name
                  model_url:
                    anyOf:
                    - type: string
                    - type: 'null'
                    title: Model Url
