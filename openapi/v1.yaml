                    anyOf:
                    - type: string
                    - type: 'null'
                    title: Modified At
                  n_ctx:
                    anyOf:
                    - type: integer
                    - type: 'null'
                    title: N Ctx
                  n_gpu_layers:
                    anyOf:
                    - type: integer
                    - type: 'null'
                    title: N Gpu Layers
                  name:
                    title: Name
                    type: string
                  node_affinity:
                    anyOf:
                    - additionalProperties: true
                      type: object
                    - type: 'null'
                    title: Node Affinity
                  node_selector:
                    anyOf:
                    - additionalProperties: true
                      type: object
                    - type: 'null'
                    title: Node Selector
                  status:
                    anyOf:
                    - type: string
                    - type: 'null'
                    title: Status
                  status_message:
                    anyOf:
                    - type: string
                    - type: 'null'
                    title: Status Message
                required:
                - id
                - name
                - deployment_type
                - status
                - status_message
                - model_name
                - model_url
                - model_filename
                - n_ctx
                - n_gpu_layers
                - gpu_count
                - endpoint_url
                - k8s_namespace
                - k8s_daemonset_name
